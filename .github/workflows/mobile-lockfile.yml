name: Sync mobile npm lockfile

on:
  push:
    branches:
      - fresh-mobile-ui
    paths:
      - "mobile/package.json"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phone app branch
        uses: actions/checkout@v4
        with:
          ref: fresh-mobile-ui
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve and update lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "Lockfile is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "chore(app): sync mobile npm lockfile"
          git push origin HEAD:fresh-mobile-ui
