name: Classic TV Pakistan Supabase Catalog APK

on:
  push:
    branches:
      - rebuild/android-tv-kotlin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-catalog-test:
    name: Build Classic TV Pakistan catalog test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Classic TV Pakistan integration
        uses: actions/checkout@v5
        with:
          ref: rebuild/android-tv-kotlin
          path: classic-tv

      - name: Check out SmartTube source and required modules
        uses: actions/checkout@v5
        with:
          repository: yuliskov/SmartTube
          ref: master
          submodules: recursive
          path: smarttube

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python and image tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Apply Classic TV Pakistan catalogue overlay
        run: |
          cd classic-tv
          python tv-integration/apply-classic-overlay.py

      - name: Build the Android TV catalog APK
        working-directory: smarttube
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStstableDebug --no-daemon

      - name: Verify package identity and collect APK
        working-directory: smarttube
        run: |
          set -euo pipefail
          APK=$(find smarttubetv/build/outputs/apk -type f -name '*universal*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find smarttubetv/build/outputs/apk -type f -name '*.apk' | head -n 1)
          fi
          test -n "$APK"
          mkdir -p test-output
          cp "$APK" test-output/ClassicTVPakistan-Catalog-Test.apk
          APK_OUT=test-output/ClassicTVPakistan-Catalog-Test.apk
          APK_BYTES=$(stat -c%s "$APK_OUT")
          echo "APK size: $APK_BYTES bytes"
          if [ "$APK_BYTES" -lt 10000000 ]; then
            echo "ERROR: APK is unexpectedly small; refusing to publish an incomplete artifact"
            exit 1
          fi
          sha256sum "$APK_OUT" | tee test-output/SHA256SUMS.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK_OUT"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          BADGING=$("$AAPT" dump badging test-output/ClassicTVPakistan-Catalog-Test.apk)
          echo "$BADGING" | grep -F "package: name='com.classictvpakistan.tv'"
          echo "$BADGING" | grep -F "application-label:'Classic TV Pakistan'"
          if echo "$BADGING" | grep -q "application-label:'SmartTube'"; then
            echo "ERROR: SmartTube launcher branding remains in the APK"
            exit 1
          fi

      - name: Upload catalog test APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassicTVPakistan-Catalog-Test
          path: smarttube/test-output/*
          if-no-files-found: error
          retention-days: 14
