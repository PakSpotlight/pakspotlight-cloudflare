name: Build isolated ARY Admin Preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ary-admin-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'feature/website-ary-source-admin' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check browser JavaScript compatibility
        run: npm run check:es2019

      - name: Deploy isolated read-only preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          OUTPUT="$(npx wrangler deploy --config wrangler.ary-preview.jsonc 2>&1)" || {
            printf '%s\n' "$OUTPUT"
            exit 1
          }
          printf '%s\n' "$OUTPUT"
          PREVIEW_URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+workers[.]dev' | head -n 1)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not find the preview Worker URL in Wrangler output."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### ARY Admin Studio preview"
            echo ""
            echo "$PREVIEW_URL/ary-preview.html"
            echo ""
            echo "This is a separate, read-only Worker. It has no Supabase binding and only serves the preview page, its stylesheet, and logo."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add or update preview link on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- ary-admin-preview-link -->';
            const url = process.env.PREVIEW_URL + '/ary-preview.html';
            const body = `${marker}
            ### ARY Admin Studio preview
            [Open the read-only preview](${url})

            This preview runs on a separate Worker with no Supabase connection. Saving is disabled; production and the Android apps are untouched.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
