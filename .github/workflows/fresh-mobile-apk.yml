name: Fresh Mobile APK (EAS)
# Phone-only preview build; push trigger runs on fresh-mobile-ui.

on:
  push:
    branches:
      - fresh-mobile-ui
      - phone-apk-icon-fix
    paths:
      - "mobile/**"
      - ".github/workflows/fresh-mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Classic TV Pakistan phone APK with EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout phone app branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check app
        run: npm run typecheck
      - name: Submit signed APK build to Expo EAS
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
