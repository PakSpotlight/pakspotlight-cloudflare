name: Validate Progressive Loading PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "public/**"
      - "scripts/check-es2019.js"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  browser-js-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check browser JavaScript compatibility
        run: npm run check:es2019
