name: Deploy Progressive Archive Preview

on:
  push:
    branches:
      - perf/progressive-archive-loading
    paths:
      - "public/**"
      - "src/**"
      - "wrangler.preview.jsonc"
      - ".github/workflows/deploy-progressive-preview.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: ctv-progressive-archive-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Validate and deploy isolated preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check browser JavaScript compatibility
        run: npm run check:es2019

      - name: Deploy isolated preview Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
