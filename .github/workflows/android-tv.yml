name: Android TV APK

# Manual-only build for the separate TV package. This workflow never publishes a release,
# never updates public/app/latest.json, and never deploys the website.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tv:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CLASSIC_TV_ANDROID_TV: "1"
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Read TV app version
        id: version
        run: |
          npx expo config --json > /tmp/expo-tv-config.json
          node -e "const c=require('/tmp/expo-tv-config.json');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'name='+c.version+'\\ncode='+c.android.versionCode+'\\npackage='+c.android.package+'\\n')"

      - name: Confirm separate TV application ID
        run: |
          test "${{ steps.version.outputs.package }}" = "com.classictvpakistan.tv"
          echo "Building ${{ steps.version.outputs.package }}"

      - name: Generate native Android TV project
        run: npx expo prebuild --platform android --no-install

      - name: Write signing keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/mobile/release.keystore"

      - name: Build signed TV APK
        if: env.KEYSTORE_B64 != ''
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/mobile/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build unsigned TV APK for smoke testing
        if: env.KEYSTORE_B64 == ''
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: classic-tv-pakistan-tv-${{ steps.version.outputs.name }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
