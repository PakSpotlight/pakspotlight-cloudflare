name: Android TV APK

# Manual build from any branch (usually main). Publishes a signed TV APK as the
# tv-v<version> GitHub release when publish=true and the signing secrets exist.
on:
  push:
    branches:
      - fix/android-tv-native-tv-framework
      - fix/tv-smarttube-inspired-player
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release for the TV APK"
        type: boolean
        default: true
permissions:
  contents: write

concurrency:
  group: android-tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tv:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CLASSIC_TV_ANDROID_TV: "1"
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Resolve TV React Native dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check the app
        run: npm run typecheck

      - name: Read TV app version
        id: version
        run: |
          npx expo config --json > /tmp/expo-tv-config.json
          node -e "const c=require('/tmp/expo-tv-config.json');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'name='+c.version+'\\ncode='+c.android.versionCode+'\\npackage='+c.android.package+'\\n')"

      - name: Confirm separate TV application ID
        run: |
          test "${{ steps.version.outputs.package }}" = "com.classictvpakistan.tv"
          echo "Building ${{ steps.version.outputs.package }}"

      - name: Generate native Android TV project
        run: npx expo prebuild --platform android --no-install

      - name: Increase Gradle distribution download timeout
        run: |
          PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          if grep -q '^networkTimeout=' "$PROPS"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$PROPS"
          else
            echo 'networkTimeout=120000' >> "$PROPS"
          fi

      - name: Write signing keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/mobile/release.keystore"

      - name: Build signed TV APK
        if: env.KEYSTORE_B64 != ''
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/mobile/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build unsigned TV APK for smoke testing
        if: env.KEYSTORE_B64 == ''
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the TV APK clearly
        working-directory: mobile
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          fi
          test -n "$APK" && test -f "$APK"
          cp "$APK" "android/app/build/outputs/apk/release/ClassicTVPakistanTV-${{ steps.version.outputs.name }}.apk"

      - name: Upload TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassicTVPakistanTV-${{ steps.version.outputs.name }}
          path: mobile/android/app/build/outputs/apk/release/ClassicTVPakistanTV-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish tv-v${{ steps.version.outputs.name }} release
        if: inputs.publish && env.KEYSTORE_B64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ClassicTVPakistanTV-${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          # This step runs in mobile/ (job defaults), so the path is mobile-relative.
          APK="android/app/build/outputs/apk/release/${APK_NAME}.apk"
          test -f "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          gh release delete "tv-v${{ steps.version.outputs.name }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "tv-v${{ steps.version.outputs.name }}" "$APK" \
            --title "Classic TV Pakistan TV v${{ steps.version.outputs.name }}" \
            --notes "Android TV build (com.classictvpakistan.tv). Install on your TV box, open from the launcher.
            - sha256: $SHA"
