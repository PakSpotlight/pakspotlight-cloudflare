name: Verify Android TV framework

on:
  push:
    branches:
      - fix/android-tv-native-tv-framework
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-framework-verification
  cancel-in-progress: false

jobs:
  verify-tv-build:
    name: Verify Android TV app compatibility and native build
    if: startsWith(github.ref, 'refs/heads/fix/android-tv-native-tv-framework')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CLASSIC_TV_ANDROID_TV: "1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      npm_config_legacy_peer_deps: "true"
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/android-tv-native-tv-framework
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Install project dependencies and align Expo packages
        run: |
          npm install
          npx expo install --fix


      - name: Verify Expo SDK 51 dependency compatibility
        run: |
          node - <<'NODE'
          const expo = require('expo/package.json').version;
          const nav = require('@react-navigation/native/package.json').version;
          const icons = require('@expo/vector-icons/package.json').version;
          if (!expo.startsWith('51.')) throw new Error('Expected Expo SDK 51, got ' + expo);
          if (!nav.startsWith('6.')) throw new Error('Expo Router 3 requires the SDK 51 navigation baseline; got ' + nav);
          if (!icons.startsWith('14.')) throw new Error('Expo SDK 51 requires vector-icons 14.x; got ' + icons);
          console.log({ expo, navigation: nav, vectorIcons: icons });
          NODE

      - name: Patch Expo permissions Kotlin nullability for Android build
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt';
          const source = fs.readFileSync(path, 'utf8');
          const broken = 'return requestedPermissions.contains(permission)';
          const fixed = 'return requestedPermissions?.contains(permission) == true';
          if (source.includes(fixed)) {
            console.log('Expo permissions nullability fix is already present.');
          } else if (source.includes(broken)) {
            fs.writeFileSync(path, source.replace(broken, fixed));
            console.log('Applied null-safe requestedPermissions check in expo-modules-core.');
          } else {
            throw new Error(`Could not find expected requestedPermissions check in ${path}; inspect the Expo module version/source.`);
          }
          NODE

      - name: Confirm TV and phone identities stay separate
        run: |
          npx expo config --json > /tmp/tv-config.json
          env -u CLASSIC_TV_ANDROID_TV npx expo config --json > /tmp/phone-config.json
          node - <<'NODE'
          const tv = require('/tmp/tv-config.json');
          const phone = require('/tmp/phone-config.json');
          if (tv.android.package !== 'com.classictvpakistan.tv') throw Error('Wrong TV package: ' + tv.android.package);
          if (phone.android.package !== 'com.classictvpakistan.app') throw Error('Phone package changed: ' + phone.android.package);
          if (!Number.isInteger(tv.android.versionCode) || tv.android.versionCode < 1) throw Error('Invalid TV version code: ' + tv.android.versionCode);
          if (tv.android.versionCode === phone.android.versionCode) throw Error('TV and phone version codes must remain separate');
          console.log({ tvPackage: tv.android.package, tvVersion: tv.version, tvVersionCode: tv.android.versionCode, phonePackage: phone.android.package, phoneVersionCode: phone.android.versionCode });
          NODE

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Type-check shared app
        run: npm run typecheck

      - name: Generate Android TV native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Write signing keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/mobile/release.keystore"

      - name: Build signed Android TV APK
        if: env.KEYSTORE_B64 != ''
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/mobile/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build unsigned APK only if signing secrets are unavailable
        if: env.KEYSTORE_B64 == ''
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        working-directory: mobile
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          if [ -n "$KEYSTORE_B64" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          else
            echo "::warning::Signing secrets unavailable; this APK is unsigned."
          fi

      - name: Upload Android TV test APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassicTVPakistanTV-tv-build-signed-test
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
