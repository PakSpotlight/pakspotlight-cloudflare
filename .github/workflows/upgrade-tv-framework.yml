name: Upgrade Android TV framework

on:
  push:
    branches:
      - fix/android-tv-native-tv-framework
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-framework-upgrade
  cancel-in-progress: false

jobs:
  upgrade-and-verify:
    name: Upgrade Expo SDK step-by-step and verify TV build
    if: startsWith(github.ref, 'refs/heads/fix/android-tv-native-tv-framework')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CLASSIC_TV_ANDROID_TV: "1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      npm_config_legacy_peer_deps: "true"

    steps:
      - name: Check out isolated TV branch
        uses: actions/checkout@v4
        with:
          ref: fix/android-tv-native-tv-framework
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Upgrade Expo SDK one major version at a time
        run: |
          set -euo pipefail
          for sdk in 52 53 54 55 56 57 58; do
            echo "::group::Upgrade to Expo SDK $sdk"
            npm install "expo@~${sdk}.0.0"
            npx expo install --fix
            npx expo-doctor
            echo "::endgroup::"
          done

      - name: Switch to the matching React Native TV fork
        run: |
          set -euo pipefail
          npm install "react-native@npm:react-native-tvos@0.88-stable" "react@19.3.0" "react-dom@19.3.0"
          node -e "const fs=require('fs');const p=require('./package.json');p.expo=p.expo||{};p.expo.install=p.expo.install||{};p.expo.install.exclude=['react-native'];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"
          npm install
          npx expo install --fix
          npx expo-doctor

      - name: Confirm TV and phone identities stay separate
        run: |
          npx expo config --json > /tmp/tv-config.json
          node -e "const c=require('/tmp/tv-config.json');if(c.android.package!=='com.classictvpakistan.tv')throw Error('Wrong TV package: '+c.android.package);if(c.android.minSdkVersion && c.android.minSdkVersion<24)throw Error('TV minSdk below 24');console.log('TV config verified:',c.android.package,c.version)"
          env -u CLASSIC_TV_ANDROID_TV npx expo config --json > /tmp/phone-config.json
          node -e "const c=require('/tmp/phone-config.json');if(c.android.package!=='com.classictvpakistan.app')throw Error('Phone package changed');if(c.android.versionCode!==2)throw Error('Phone versionCode changed');console.log('Phone identity verified:',c.android.package,c.version)"

      - name: Type-check shared app
        run: npm run typecheck

      - name: Generate Android TV native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android TV APK (unsigned verification build)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassicTVPakistanTV-framework-verification
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified dependency migration to this branch
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "build(tv): upgrade Expo and React Native TV framework [skip ci]"
            git push origin HEAD:fix/android-tv-native-tv-framework
          fi
