name: Verify Android TV framework

on:
  push:
    branches:
      - fix/android-tv-native-tv-framework
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-framework-verification
  cancel-in-progress: false

jobs:
  verify-tv-build:
    name: Verify Android TV app compatibility and native build
    if: startsWith(github.ref, 'refs/heads/fix/android-tv-native-tv-framework')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CLASSIC_TV_ANDROID_TV: "1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      npm_config_legacy_peer_deps: "true"

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/android-tv-native-tv-framework
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Install project dependencies and align Expo packages
        run: |
          npm install
          npx expo install --fix

      - name: Patch Expo permissions Kotlin nullability for Android build
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt';
          const source = fs.readFileSync(path, 'utf8');
          const broken = 'return requestedPermissions.contains(permission)';
          const fixed = 'return requestedPermissions?.contains(permission) == true';
          if (source.includes(fixed)) {
            console.log('Expo permissions nullability fix is already present.');
          } else if (source.includes(broken)) {
            fs.writeFileSync(path, source.replace(broken, fixed));
            console.log('Applied null-safe requestedPermissions check in expo-modules-core.');
          } else {
            throw new Error(`Could not find expected requestedPermissions check in ${path}; inspect the Expo module version/source.`);
          }
          NODE

      - name: Confirm TV and phone identities stay separate
        run: |
          npx expo config --json > /tmp/tv-config.json
          node -e "const c=require('/tmp/tv-config.json');if(c.android.package!=='com.classictvpakistan.tv')throw Error('Wrong TV package: '+c.android.package);if(c.android.versionCode!==8)throw Error('Wrong TV version code: '+c.android.versionCode)"
          env -u CLASSIC_TV_ANDROID_TV npx expo config --json > /tmp/phone-config.json
          node -e "const c=require('/tmp/phone-config.json');if(c.android.package!=='com.classictvpakistan.app')throw Error('Phone package changed');if(c.android.versionCode!==2)throw Error('Phone version code changed')"

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Type-check shared app
        run: npm run typecheck

      - name: Generate Android TV native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android TV APK (unsigned verification build)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassicTVPakistanTV-framework-verification
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
