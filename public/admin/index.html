<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pak Spotlight — Classic PTV Drama Archive</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#050608;color:#f5f2ea;font-family:Arial,sans-serif}
a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:20;background:rgba(5,6,8,.97);border-bottom:1px solid #292b30;display:flex;align-items:center;justify-content:space-between;padding:16px 5%;gap:20px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:55px;height:55px;object-fit:contain}.brand b{display:block;letter-spacing:2px}.brand small{font-size:9px;color:#aaa;letter-spacing:1.4px}
main{min-height:80vh}.hero{min-height:620px;padding:80px 7%;display:flex;align-items:center;background:radial-gradient(circle at 78% 35%,#174d25 0,#101915 22%,#08090c 62%);position:relative;overflow:hidden}
.hero-copy{max-width:700px;z-index:1}.tag{color:#ffd34e;letter-spacing:3px;font-size:11px;font-weight:bold}h1{font-size:clamp(50px,7vw,90px);line-height:.95;margin:18px 0}h1 span{color:#ffd34e}.heroP{max-width:500px;font-size:18px;line-height:1.6;margin:28px 0;color:#aaa}
.btn{display:inline-block;padding:14px 21px;border-radius:8px;font-weight:bold;margin:8px 8px 0 0}.gold{background:#ffd34e;color:#17130a}.outline{border:1px solid #666}
section{padding:75px 7%}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}h2{font-size:40px;margin:8px 0}input{background:#111318;border:1px solid #353838;border-radius:8px;padding:14px;color:#f5f2ea;width:300px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#111216;border:1px solid #292c32;border-radius:12px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-8px);border-color:#ffd34e}
.band{background:linear-gradient(90deg,#171205,#251d08);border-top:1px solid #57451b;border-bottom:1px solid #57451b;display:flex;justify-content:space-between;align-items:center;gap:25px}
.years{display:flex;gap:12px;flex-wrap:wrap}.years a{border:1px solid #34363c;background:#111216;padding:15px 25px;border-radius:8px}.years a:hover{border-color:#ffd34e}
.detail{max-width:1050px;margin:auto;padding:70px 7%}.detail-top{display:grid;grid-template-columns:360px 1fr;gap:40px;align-items:start}.detail-poster{min-height:400px;border-radius:14px;border:1px solid #292c32;overflow:hidden}
footer{border-top:1px solid #292b30;padding:35px 7%;color:#888;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px}
@media(max-width:800px){nav{display:none}.grid{grid-template-columns:1fr}.head{display:block}input{width:100%;margin-top:15px}.band{display:block}.detail-top{grid-template-columns:1fr}.detail-poster{min-height:auto}}

.admin-shell{max-width:1100px;margin:auto;padding:35px 7%}.admin-shell .panel{background:#111216;border:1px solid #292c32;border-radius:14px;padding:25px;margin-bottom:22px}
.admin-shell .form{display:grid;grid-template-columns:1fr 1fr;gap:20px}.admin-shell label{display:block;color:#aaa;font-size:11px;font-weight:bold;margin:10px 0 4px}
.admin-shell input,.admin-shell textarea,.admin-shell select{background:#0f1217;border:1px solid #2a2d32;border-radius:6px;padding:10px;color:#f5f2ea;width:100%;font-family:inherit}
.admin-shell textarea{resize:vertical;min-height:80px}.admin-shell button{background:#ffd34e;color:#17130a;border:none;border-radius:6px;padding:10px 16px;font-weight:bold;cursor:pointer;margin-top:8px}
.admin-shell button:hover{opacity:.9}.admin-btn{display:inline-block;margin-right:8px;margin-bottom:8px;padding:10px 16px;background:#2a2d32;border:1px solid #35383d;border-radius:6px;color:#f5f2ea;cursor:pointer;font-weight:bold;font-size:12px}
.admin-btn.gold{background:#ffd34e;color:#17130a;border:none}.admin-btn.active{background:#35383d;border-color:#ffd34e}.admin-btn:hover{border-color:#ffd34e}.meta{color:#999;font-size:12px;margin-top:4px}
.admin-only{display:none}.showAdmin .admin-only{display:block}.showAdmin #app{display:none}

:root{--bg:#0b0d10;--panel:#14171c;--line:#292e36;--text:#f5f5f3;--muted:#a8afb9;--gold:#ffd34e}
html{scroll-behavior:smooth}body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.topbar{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand admin" "nav nav";row-gap:8px;padding:9px 5%;min-height:68px;background:rgba(9,11,14,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);align-items:center}
.topbar .brand{grid-area:brand;display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}.topbar .logo{width:48px;height:48px;object-fit:contain;flex-shrink:0}.topbar .brand b{font-size:16px;letter-spacing:2px;white-space:nowrap}.topbar .brand small{font-size:8px;color:var(--muted);white-space:nowrap}
.topbar .admin-switch{grid-area:admin;justify-self:end;display:block;border:1px solid #555;background:#171a1f;color:#fff;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer}
.topbar .public-nav{grid-area:nav;width:100%;display:flex;justify-content:center;align-items:center;gap:24px;overflow-x:auto;white-space:nowrap;padding:3px 0 2px;scrollbar-width:none}
.topbar .public-nav::-webkit-scrollbar{display:none}.topbar .public-nav a{flex:0 0 auto;font-weight:700}
.hero{min-height:330px;padding:58px 6%;background:radial-gradient(circle at 80% 30%,#244e2d 0,#121a16 25%,#080a0d 67%)}.hero h1{font-size:clamp(40px,5vw,70px)}
section{padding:42px max(16px,6%)}.head{margin-bottom:18px;align-items:center}.head h2{font-size:30px;margin:6px 0}.tag{font-size:10px;letter-spacing:2px}
.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}.card:hover{transform:translateY(-4px)}
.band{background:transparent;border:0;padding:0}.years{gap:8px}.years a{padding:10px 16px}
footer{padding:26px 6%;color:#7f8792}
.detail{padding:40px 6%}.detail-top{grid-template-columns:minmax(230px,300px) 1fr;gap:28px}.detail-poster{height:auto;aspect-ratio:16/9}

.video-wrap{position:relative;width:100%;max-width:1000px;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.video-wrap iframe{width:100%;height:100%;display:block;border:0}.player-section{padding-top:10px}

@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.topbar{gap:12px}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:8px 22px;row-gap:7px}.topbar .public-nav{justify-content:flex-start;gap:20px;font-size:13px}.logo{width:48px}.brand b{font-size:15px}.brand small{font-size:8px}}

.auth-box{max-width:520px;margin:55px auto;padding:28px;background:#111216;border:1px solid #292c32;border-radius:14px}
.auth-box h1{margin-top:0;margin-bottom:12px}.auth-box label{display:block;color:#aaa;font-size:12px;font-weight:bold;margin:16px 0 6px}
.auth-box input{width:100%;background:#0f1217;border:1px solid #2a2d32;border-radius:6px;padding:10px;color:#f5f2ea;font-family:inherit}
.auth-box button{width:100%;padding:12px;margin-top:16px;background:#ffd34e;color:#17130a;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:14px}
.auth-box button:hover{opacity:.9}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" onclick="goHome();return false">
    <img class="logo" src="/logo.png" alt="Pak Spotlight" width="48" height="48">
    <div><b>PAK SPOTLIGHT</b><small>CLASSIC PAKISTANI TELEVISION</small></div>
  </a>
  <button class="admin-switch" id="adminSwitch" onclick="toggleAdmin()">ADMIN</button>
</header>
<main id="app"></main>
<main id="adminApp" class="admin-only">
  <div class="admin-shell">
    <div style="margin-bottom:20px">
      <button class="admin-btn active" id="dashBtn" onclick="showDashboard()">Dashboard</button>
      <button class="admin-btn" id="addBtn" onclick="showAddForm()">Add Drama</button>
      <button class="admin-btn" onclick="logoutAdmin()">LOG OUT</button>
    </div>
    <section id="adminDash"><h1>Drama Dashboard</h1><div class="panel"><h2 id="dramCount">0 Dramas</h2><div id="adminList"></div></div></section>
    <section id="adminForm" style="display:none"><h1>Add Drama</h1><div class="panel"><form id="dramForm" onsubmit="saveDrama(event)">
      <div><label>English Title *</label><input id="title" required></div>
      <div><label>Urdu Title</label><input id="urdu"></div>
      <div class="admin-shell form"><div><label>Year</label><input id="year" type="number"></div><div><label>Type</label><input id="type"></div></div>
      <div><label>Description</label><textarea id="desc"></textarea></div>
      <div><label>YouTube URL</label><input id="youtube" type="url"></div>
      <div style="margin-top:16px"><button type="submit" class="admin-btn gold">SAVE</button><button type="button" class="admin-btn" onclick="showDashboard()">CANCEL</button></div>
      <div id="formMsg" style="margin-top:12px;color:#ffd34e;font-size:12px"></div>
    </form></div></section>
  </div>
</main>
<footer><div><b>PAK SPOTLIGHT</b><br>Classic PTV Drama Archive</div><div>© 2026 Pak Spotlight</div></footer>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase = createClient("https://whcseoasnaswlhnzduix.supabase.co", "sb_publishable_fkK2ryuBKr0WK96m34Cczg_7ofQBaOk");

let authSession = null;
let dramas = [];

async function checkAuth() {
  const { data } = await supabase.auth.getSession();
  authSession = data.session || null;
  updateUI();
}

async function loginUser(email, password) {
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) throw error;
  authSession = data.session;
  checkAuth();
}

async function logoutAdmin() {
  await supabase.auth.signOut();
  authSession = null;
  checkAuth();
}

function toggleAdmin() {
  if (!authSession) {
    showLoginForm();
  } else {
    document.body.classList.toggle("showAdmin");
  }
}

function showLoginForm() {
  document.getElementById("app").innerHTML = `
    <section><div class="auth-box">
      <h1>Admin Login</h1>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <label>Email</label><input id="email" type="email" required>
        <label>Password</label><input id="password" type="password" required>
        <button type="submit">Sign In</button>
        <div id="loginMsg" style="margin-top:10px;color:#f5a623;font-size:12px"></div>
      </form>
    </div></section>
  `;
  window.handleLogin = async (e) => {
    e.preventDefault();
    try {
      await loginUser(document.getElementById("email").value, document.getElementById("password").value);
      document.body.classList.add("showAdmin");
      loadDramas();
    } catch (err) {
      document.getElementById("loginMsg").textContent = "Login failed: " + err.message;
    }
  };
}

async function loadDramas() {
  const { data, error } = await supabase.from("Drama").select("id,title,urdu_title,year,type,description,youtube_url");
  if (error) console.error(error);
  dramas = data || [];
  renderDashboard();
}

function renderDashboard() {
  document.getElementById("dramCount").textContent = dramas.length + " Dramas";
  document.getElementById("adminList").innerHTML = dramas.map(d => `
    <div class="panel" style="padding:12px;margin-bottom:10px;border-left:3px solid #ffd34e">
      <div style="display:flex;justify-content:space-between;align-items:center"><div><b>${d.title}</b><br><small style="color:#999">${d.year || "N/A"} • ${d.type || "N/A"}</small></div>
      <div style="display:flex;gap:8px"><button class="admin-btn" onclick="editDrama('${d.id}')">Edit</button><button class="admin-btn" onclick="deleteDrama('${d.id}')">Delete</button></div></div>
    </div>
  `).join("");
}

function showDashboard() {
  document.getElementById("dashBtn").classList.add("active");
  document.getElementById("addBtn").classList.remove("active");
  document.getElementById("adminDash").style.display = "block";
  document.getElementById("adminForm").style.display = "none";
}

function showAddForm() {
  document.getElementById("dashBtn").classList.remove("active");
  document.getElementById("addBtn").classList.add("active");
  document.getElementById("adminDash").style.display = "none";
  document.getElementById("adminForm").style.display = "block";
}

async function saveDrama(e) {
  e.preventDefault();
  if (!authSession) { showLoginForm(); return; }
  const msg = document.getElementById("formMsg");
  msg.textContent = "Saving...";
  try {
    await supabase.from("Drama").insert([{
      title: document.getElementById("title").value,
      urdu_title: document.getElementById("urdu").value || null,
      year: document.getElementById("year").value || null,
      type: document.getElementById("type").value || null,
      description: document.getElementById("desc").value || null,
      youtube_url: document.getElementById("youtube").value || null
    }]);
    msg.textContent = "Saved!";
    setTimeout(() => { document.getElementById("dramForm").reset(); loadDramas(); showDashboard(); }, 1000);
  } catch (err) {
    msg.textContent = "Error: " + err.message;
  }
}

window.editDrama = (id) => { alert("Edit feature coming soon for: " + id); };
window.deleteDrama = async (id) => {
  if (confirm("Delete this drama?")) {
    await supabase.from("Drama").delete().eq("id", id);
    loadDramas();
  }
};

window.showDashboard = showDashboard;
window.showAddForm = showAddForm;
window.saveDrama = saveDrama;
window.logoutAdmin = logoutAdmin;
window.toggleAdmin = toggleAdmin;
window.goHome = () => { document.body.classList.remove("showAdmin"); };

// Initialize
document.getElementById("app").innerHTML = '<section class="hero"><div class="hero-copy"><div class="tag">CLASSIC PAKISTANI TELEVISION</div><h1>PAK SPOTLIGHT</h1><p>Loading archive...</p></div></section>';
checkAuth();
</script>
</body>
</html>
