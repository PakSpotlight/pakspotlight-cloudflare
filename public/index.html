<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pak Spotlight — Classic PTV Drama Archive</title>
<style>
:root{--bg:#0b0d10;--panel:#14171c;--line:#292e36;--text:#f5f5f3;--muted:#a8afb9;--gold:#ffd34e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}

.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:8px max(16px,4vw);background:rgba(9,11,14,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.topbar .brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}.topbar .logo{width:48px;height:48px;object-fit:contain}.topbar .brand b{font-size:16px;letter-spacing:2px}.topbar .brand small{display:block;color:#9aa1aa;font-size:8px;letter-spacing:1.1px;margin-top:3px}
.topbar .public-nav{display:flex;align-items:center;justify-content:flex-end;gap:18px;flex:0 1 auto;overflow-x:auto;white-space:nowrap;scrollbar-width:none}.topbar .public-nav::-webkit-scrollbar{display:none}.topbar .public-nav a{flex:0 0 auto;font-weight:700;font-size:12px;color:#ddd}.topbar .public-nav a:hover{color:var(--gold)}
.admin-switch{display:none}

main{min-height:80vh}

.hero{min-height:330px;padding:58px 6%;display:flex;align-items:center;background:radial-gradient(circle at 80% 30%,#244e2d 0,#121a16 25%,#080a0d 67%);position:relative;overflow:hidden}
.hero-copy{max-width:680px;z-index:1}.tag{color:var(--gold);letter-spacing:2px;font-size:10px;font-weight:bold}
.hero h1{font-size:clamp(42px,7vw,76px);line-height:.95;margin:14px 0 8px}.hero h1 span{color:var(--gold)}
.hero p{font-size:16px;line-height:1.6;color:#c1c6cd;max-width:610px}
.btn{display:inline-block;padding:14px 21px;border-radius:8px;font-weight:bold;margin:8px 8px 0 0}.btn.gold{background:var(--gold);color:#17130a}.btn.outline{border:1px solid #666}

section{padding:42px max(16px,6%)}
.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}h2{font-size:30px;margin:6px 0}
.head input{background:#111419;border:1px solid #343a43;color:#fff;border-radius:7px;padding:11px 13px;width:240px}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:#77611e}
.poster{aspect-ratio:16/9;background:#1b2027;display:grid;place-items:center;text-align:center;padding:0;color:var(--gold);font-size:28px;font-weight:900;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block}.poster b{padding:12px}
.body{padding:13px}.body h3{font-size:18px;margin:0 0 5px}.meta{font-size:11px;color:#8e96a1}.body p{font-size:12px;line-height:1.45;color:#9fa6af;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.watch{color:var(--gold);font-weight:bold;font-size:11px}
.card .watch{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;padding:9px 14px;border:1px solid rgba(255,211,78,.55);border-radius:999px;background:rgba(255,211,78,.08);font-size:11px;letter-spacing:.3px;line-height:1;transition:.2s}
.card:hover .watch{background:var(--gold);color:#08090b;border-color:var(--gold);transform:translateY(-1px)}
.section-note{color:#969eaa;margin:-5px 0 18px;font-size:14px}
.empty{padding:30px;border:1px dashed #4b4d54;border-radius:10px;color:#aaa}

.band{background:transparent;border:0;padding:0}.years{display:flex;gap:8px;flex-wrap:wrap}.years a{border:1px solid #34363c;background:#111216;padding:10px 16px;border-radius:8px}.years a:hover{border-color:var(--gold)}

.detail{max-width:1050px;margin:auto;padding:40px 6%}.detail-top{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:28px;align-items:start}
.detail-poster{aspect-ratio:16/9;border-radius:14px;border:1px solid #3c3e45;background:#1b2027;display:grid;place-items:center;text-align:center;padding:0;color:var(--gold);font-size:42px;font-weight:900;overflow:hidden}.detail-poster img{width:100%;height:100%;object-fit:cover}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:25px 0}.info div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px}.info b{display:block;color:#888;font-size:11px;text-transform:uppercase;margin-bottom:5px}

.video-wrap{position:relative;width:100%;max-width:1000px;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}.video-wrap iframe{width:100%;height:100%;display:block;border:0}
.player-section{padding-top:10px}
.episodes{display:grid;gap:9px}.episode{background:#13161b;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;align-items:center;gap:12px}.episode .btn.playing{opacity:.7}

footer{border-top:1px solid var(--line);padding:26px 6%;color:#7f8792;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px}

/* Admin Shell */
.admin-shell{max-width:1050px;margin:auto;padding:30px 6%}.admin-shell .panel{background:#13161b;border:1px solid var(--line);border-radius:14px;padding:25px;margin-bottom:22px}.admin-shell .form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.admin-shell label{display:block;color:#aaa;font-size:12px;font-weight:bold;margin-bottom:7px}.admin-shell input,.admin-shell textarea,.admin-shell select{width:100%;background:#0d1014;border:1px solid #363940;color:#fff;border-radius:7px;padding:12px}.admin-shell textarea{min-height:110px;resize:vertical}.admin-shell .full{grid-column:1/-1}.admin-shell .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.admin-shell .admin-btn{border:1px solid #383b42;background:#15171b;color:#eee;border-radius:8px;padding:12px 17px;cursor:pointer;font-weight:bold}.admin-shell .admin-btn.gold{background:var(--gold);color:#15120a;border-color:var(--gold)}.admin-shell .admin-btn.danger{color:#ff7777;border-color:#663333}.admin-shell .drama-row{display:flex;justify-content:space-between;gap:15px;align-items:center;border:1px solid var(--line);background:#0d0f12;padding:16px;border-radius:10px;margin-top:10px}.admin-shell .note{color:#aaa;line-height:1.6;font-size:14px}.admin-shell .success{color:#8ee6a5;margin-top:12px}

/* Auth Box */
.auth-box{max-width:520px;margin:55px auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.auth-box h1{margin-top:0}.auth-box label{display:block;color:#aaa;font-size:12px;font-weight:bold;margin:14px 0 7px}.auth-box input{width:100%;box-sizing:border-box;background:#080a0d;border:1px solid #363940;color:#fff;border-radius:7px;padding:13px}.auth-box .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.auth-error{color:#ff8585;margin-top:12px}.auth-success{color:#8ee6a5;margin-top:12px}

/* Responsive */
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.topbar{gap:12px}.topbar .public-nav{gap:12px}}
@media(max-width:850px){.topbar{flex-wrap:wrap}.topbar .brand{margin-right:0}.topbar .public-nav{order:3;width:100%;justify-content:space-between;gap:8px;padding:3px 0}.topbar .public-nav a{font-size:11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.head{display:flex}.head input{width:220px}.detail-top{grid-template-columns:1fr}.detail-poster{max-width:420px}.hero{min-height:280px}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.video-wrap{border-radius:8px}}
@media(max-width:520px){.topbar{padding:8px 12px}.topbar .logo{width:42px;height:42px}.topbar .brand b{font-size:13px}.topbar .brand small{font-size:7px}.topbar .public-nav{overflow-x:auto;justify-content:flex-start;gap:20px}.topbar .public-nav a{white-space:nowrap}.hero{padding:42px 16px}.hero h1{font-size:42px}section{padding:30px 16px}.head{display:block}.head input{width:100%;margin-top:10px}.grid{gap:10px}.body{padding:10px}.body h3{font-size:15px}.body p{display:none}.card .watch{font-size:10px;padding:8px 11px;margin-top:8px}.watch{font-size:10px}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="#" onclick="goHome();return false"><img class="logo" src="/logo.png" alt="Pak Spotlight" width="48" height="48"><div><b>PAK SPOTLIGHT</b><small>CLASSIC PTV DRAMA ARCHIVE</small></div></a><nav class="public-nav"><a href="#" onclick="goHome();return false">HOME</a><a href="#series" onclick="navTo('series');return false">DRAMA SERIALS</a><a href="#longplays" onclick="navTo('longplays');return false">LONG PLAYS</a><a href="#comedy" onclick="navTo('comedy');return false">COMEDY</a><a href="#shorts" onclick="navTo('shorts');return false">SHORTS</a></nav></header>
<main id="app"></main>
<footer><div><b>PAK SPOTLIGHT</b><br>Classic PTV Drama Archive</div><div>Privacy · Terms · Copyright / Removal · Contact</div><div>© 2026 Pak Spotlight</div></footer>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient("https://whcseoasnaswlhnzduix.supabase.co", "sb_publishable_fkK2ryuBKr0WK96m34Cczg_7ofQBaOk");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let rows = [], editingId = null, editingImage = "", loadPromise = null, viewMode = "home", viewType = "", dataReady = false;
let authSession = null;

function map(r) {
  return {
    id: r.id, title: r.title ?? r.Title ?? "", urdu: r.urdu_title ?? r.urdu ?? r.Urdu ?? "",
    year: r.year ?? "", type: r.type ?? "", writer: r.writer ?? "", produced: r.produced ?? "",
    director: r.director ?? "", cast: r.cast ?? "", description: r.description ?? "",
    youtube: r.youtube_url ?? r.youtube ?? "", image: r.thumbnail_url ?? r.image ?? r.thumbnail ?? "",
    series: r.series_name ?? "", episode: r.episode_number == null ? null : Number(r.episode_number)
  };
}

function normalize(s) { return String(s ?? "").replace(/\s+/g, " ").trim().toLowerCase(); }

async function load(force = false) {
  if (loadPromise && !force) return loadPromise;
  loadPromise = (async () => {
    let q = await supabase.from("Drama").select("id,title,urdu_title,year,type,writer,director,cast,description,youtube_url,series_name,episode_number");
    if (q.error) { console.warn("Fast query failed; using full query", q.error); q = await supabase.from("Drama").select("*"); }
    if (q.error) { console.error("Drama load failed", q.error); dataReady = false; return rows; }
    rows = (q.data || []).map(map);
    dataReady = true;
    return rows;
  })();
  return loadPromise;
}

function scheduleThumbs() { setTimeout(() => hydrateThumbs(), 100); }

async function hydrateThumbs() {
  const ids = rows.map(r => r.id).filter(Boolean);
  if (!ids.length) return;
  const batches = [];
  for (let i = 0; i < ids.length; i += 4) batches.push(ids.slice(i, i + 4));
  for (let start = 0; start < batches.length; start += 4) {
    const group = batches.slice(start, start + 4);
    await Promise.all(group.map(async batch => {
      try {
        const q = await supabase.from("Drama").select("id,thumbnail_url").in("id", batch);
        if (!q.error) {
          const im = new Map((q.data || []).map(x => [String(x.id), x.thumbnail_url || ""]));
          rows.forEach(r => { if (im.has(String(r.id))) r.image = im.get(String(r.id)); });
          if (viewMode === "home" && document.visibilityState !== "hidden") renderHomeInPlace();
        }
      } catch (e) { console.warn("Thumbnail load failed", e); }
    }));
  }
}

function isSeries(d) { return ["Serial / Series", "Series", "Serial", "Comedy"].includes(String(d.type || "")); }

function yt(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtu.be")) return u.pathname.split("/").filter(Boolean)[0] || "";
    if (u.hostname.includes("youtube.com")) {
      if (u.pathname === "/watch") return u.searchParams.get("v") || "";
      const parts = u.pathname.split("/").filter(Boolean);
      const i = parts.findIndex(x => ["embed", "shorts", "live"].includes(x));
      if (i >= 0) return parts[i + 1] || "";
      return u.searchParams.get("v") || parts.pop() || "";
    }
  } catch {}
  return "";
}

function poster(d, extra = "") {
  return d.image
    ? `<div class="poster ${extra}"><img src="${esc(d.image)}" alt="${esc(d.title)}" decoding="async"></div>`
    : `<div class="poster ${extra}"><b>${esc(d.title)}</b></div>`;
}

function groups(list) {
  const m = new Map();
  for (const d of list) {
    const series = isSeries(d) && String(d.series || "").trim();
    const key = series ? "series:" + String(d.type).trim().toLowerCase() + ":" + normalize(series) : "id:" + d.id;
    if (!m.has(key)) m.set(key, []);
    m.get(key).push(d);
  }
  return [...m.values()].map(g => g.sort((a, b) => (a.episode ?? 999999) - (b.episode ?? 999999)));
}

function card(g) {
  const d = g[0], series = isSeries(d) && !!String(d.series || "").trim(), title = series ? d.series : d.title;
  return `<article class="card" onclick="openItem('${encodeURIComponent(String(d.id))}')">${poster(d)}<div class="body"><h3>${esc(title)}</h3><div class="meta">${esc(d.year)} · ${esc(d.type)}${series ? ` · ${g.length} Episode${g.length === 1 ? '' : 's'}` : ''}</div><p>${esc(d.description)}</p><span class="watch">${series ? 'OPEN SERIES →' : 'OPEN DRAMA →'}</span></div></article>`;
}

function renderAll(list) {
  const gs = groups(list);
  $('cards').innerHTML = gs.length ? gs.map(card).join("") : "<div class='empty'>No dramas found.</div>";
  const series = gs.filter(g => ["Serial / Series", "Series", "Serial"].includes(g[0].type) && g[0].series);
  $('seriesCards').innerHTML = series.length ? series.map(card).join("") : "<div class='empty'>No series added yet.</div>";
  const lp = gs.filter(g => g[0].type === "Long Play");
  $('longCards').innerHTML = lp.length ? lp.map(card).join("") : "<div class='empty'>No long plays yet.</div>";
  const co = gs.filter(g => g[0].type === "Comedy");
  $('comedyCards').innerHTML = co.length ? co.map(card).join("") : "<div class='empty'>No comedy entries yet.</div>";
  const sh = gs.filter(g => g[0].type === "Shorts");
  $('shortCards').innerHTML = sh.length ? sh.map(card).join("") : "<div class='empty'>No shorts yet.</div>";
}

function home(list = rows) {
  viewMode = "home"; viewType = "";
  document.title = "Pak Spotlight — Classic PTV Drama Archive";
  $('app').innerHTML = `
    <section class="hero"><div class="hero-copy"><div class="tag">CLASSIC PAKISTANI TELEVISION</div><h1>PAK SPOTLIGHT</h1><p>Explore the golden era of Pakistani television — timeless dramas, unforgettable stories and legendary performances, all gathered in one place.</p><a class="btn gold" href="#archive">BROWSE DRAMAS ↓</a></div></section>
    <section id="archive"><div class="head"><div><div class="tag">PAK SPOTLIGHT ARCHIVE</div><h2>All Dramas</h2></div><input id="search" placeholder="Search dramas..." aria-label="Search dramas"></div><div class="grid" id="cards"></div></section>
    <section id="series"><div class="head"><div><div class="tag">DRAMA SERIALS</div><h2>Drama Serials</h2></div></div><div class="grid" id="seriesCards"></div></section>
    <section id="longplays"><div class="head"><div><div class="tag">LONG PLAYS</div><h2>Classic Long Plays</h2></div></div><div class="grid" id="longCards"></div></section>
    <section id="comedy"><div class="head"><div><div class="tag">COMEDY</div><h2>Comedy</h2></div></div><div class="grid" id="comedyCards"></div></section>
    <section id="shorts"><div class="head"><div><div class="tag">SHORTS</div><h2>Shorts</h2></div></div><div class="grid" id="shortCards"></div></section>`;
  renderAll(list);
  const search = $('search');
  if (search) search.oninput = () => renderAll(list.filter(d =>
    (d.title + " " + d.urdu + " " + d.year + " " + d.type + " " + d.writer + " " + d.series).toLowerCase().includes(search.value.toLowerCase())
  ));
}

function renderHomeInPlace() {
  if (viewMode !== "home") return;
  const list = viewType ? rows.filter(d => d.type === viewType) : rows;
  renderAll(list);
}

function renderCurrent() { renderHomeInPlace(); }

window.openItem = function(id) {
  viewMode = "detail"; viewType = "";
  const d = rows.find(x => String(x.id) === decodeURIComponent(id));
  if (!d) return;
  const eps = isSeries(d) && d.series
    ? rows.filter(x => normalize(x.series) === normalize(d.series) && String(x.type) === String(d.type)).sort((a, b) => (a.episode ?? 999999) - (b.episode ?? 999999))
    : [d];
  const series = isSeries(d) && !!d.series;
  const first = eps.find(e => yt(e.youtube)) || d;
  const firstId = yt(first.youtube);
  $('app').innerHTML = `
    <a class="watch" href="#" onclick="goHome();return false">← BACK TO ARCHIVE</a>
    <section><div class="detail-top">${poster(d, 'detail-poster')}<div><div class="tag">${esc(d.type)}</div><h1>${esc(series ? d.series : d.title)}</h1>${d.urdu ? `<h2>${esc(d.urdu)}</h2>` : ""}<p>${esc(d.description)}</p><div class="info"><div><b>Year</b>${esc(d.year)}</div><div><b>Type</b>${esc(d.type)}</div><div><b>Writer</b>${esc(d.writer)}</div><div><b>Director</b>${esc(d.director)}</div><div><b>Cast</b>${esc(d.cast)}</div></div></div></div></section>
    ${firstId ? `<section class="player-section"><h2>▶ Watch</h2><div class="video-wrap"><iframe id="ytPlayer" src="https://www.youtube.com/embed/${firstId}?rel=0" title="${esc(series ? d.series : d.title)}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></section>` : ""}
    <section><h2>${series ? 'Episodes' : 'Watch'}</h2><div class="episodes">${eps.map((e, i) => {
      const vid = yt(e.youtube);
      return `<div class="episode ${i === 0 && vid ? 'selected' : ''}"><div class="epno">${e.episode ?? i + 1}</div><div class="epbody"><b>${series ? 'Episode ' + (e.episode ?? i + 1) : esc(e.title)}</b><span class="meta">${esc(e.year)}</span></div>${vid ? `<button class="btn gold ${i === 0 ? 'playing' : ''}" onclick="playEpisode('${vid}',this);return false">▶ ${series ? 'PLAY EPISODE ' + (e.episode ?? i + 1) : 'WATCH'}</button>` : `<span class="meta">Video link not added</span>`}</div>`;
    }).join("")}</div></section>`;
  window.scrollTo(0, 0);
};

window.playEpisode = function(videoId, btn) {
  const p = $('ytPlayer');
  if (!p) return;
  p.src = `https://www.youtube.com/embed/${videoId}?rel=0&autoplay=1`;
  document.querySelectorAll('.episode .btn').forEach(b => b.classList.remove('playing'));
  if (btn) btn.classList.add('playing');
  document.querySelectorAll('.episode').forEach(e => e.classList.remove('selected'));
  btn?.closest('.episode')?.classList.add('selected');
  document.querySelector('.player-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

window.goHome = function() {
  if (!dataReady) { load().then(() => home(rows)); return; }
  home(rows);
};

window.showCategory = function(type) {
  const filter = d => type === "SERIES" ? ["Serial / Series", "Series", "Serial"].includes(d.type) : type ? d.type === type : true;
  if (!dataReady) {
    load().then(() => { viewType = type; home(rows.filter(filter)); window.scrollTo(0, 0); });
    return;
  }
  viewType = type;
  home(rows.filter(filter));
  window.scrollTo(0, 0);
};

function adminForm(d = null) {
  editingId = d?.id || null; editingImage = d?.image || "";
  $('app').innerHTML = `<section class="admin-shell"><a class="watch" href="#" onclick="goHome();return false">← WEBSITE</a><h1>${d ? 'Edit ' + esc(d.title) : 'Add Drama'}</h1><form id="form" class="form"><div><label>English Title *</label><input id="title" required value="${esc(d?.title)}"></div><div><label>Urdu Title</label><input id="urdu" value="${esc(d?.urdu)}"></div><div><label>Year</label><input id="year" value="${esc(d?.year)}"></div><div><label>Category</label><select id="type"><option>Serial / Series</option><option>Long Play</option><option>Comedy</option><option>Shorts</option></select></div><div><label>Series Name (for episodes)</label><input id="series" value="${esc(d?.series)}" placeholder="e.g. Nuskha Hazir Hai"></div><div><label>Episode Number</label><input id="episode" type="number" min="1" value="${d?.episode ?? ''}" placeholder="1, 2, 3..."></div><div><label>Writer</label><input id="writer" value="${esc(d?.writer)}"></div><div><label>Director</label><input id="director" value="${esc(d?.director)}"></div><div><label>Produced</label><input id="produced" value="${esc(d?.produced)}"></div><div class="full"><label>Cast</label><input id="cast" value="${esc(d?.cast)}"></div><div class="full"><label>Description</label><textarea id="description">${esc(d?.description)}</textarea></div><div class="full"><label>YouTube Link</label><input id="youtube" type="url" value="${esc(d?.youtube)}" placeholder="https://youtu.be/..."></div><div class="full"><label>Thumbnail Image</label><input id="image" type="file" accept="image/*"><div class="meta">When editing, leave this empty to keep the existing thumbnail.</div></div><div class="full actions"><button class="gold" type="submit">SAVE DRAMA</button><button type="button" onclick="showAdmin()">CANCEL</button></div><div class="full msg" id="msg"></div></form></section>`;
  $('type').value = d?.type || 'Serial / Series';
  $('form').onsubmit = saveForm;
}

async function saveForm(e) {
  e.preventDefault();
  if (!authSession) { showLogin(); return; }
  $('msg').textContent = 'Saving...';
  const f = $('image').files[0];
  if (f && f.size > 3 * 1024 * 1024) { $('msg').textContent = 'Thumbnail must be under 3 MB.'; return; }
  const payload = {
    title: $('title').value.trim(), urdu_title: $('urdu').value.trim(), year: $('year').value.trim(),
    type: $('type').value, series_name: $('series').value.trim(),
    episode_number: $('episode').value ? Number($('episode').value) : null,
    writer: $('writer').value.trim(), director: $('director').value.trim(),
    produced: $('produced').value.trim(), cast: $('cast').value.trim(),
    description: $('description').value.trim(), youtube_url: $('youtube').value.trim()
  };
  let id = editingId;
  let q;
  if (editingId) {
    q = await supabase.from('Drama').update(payload).eq('id', editingId);
    if (q.error) { $('msg').textContent = 'Save failed: ' + q.error.message; return; }
  } else {
    q = await supabase.from('Drama').insert(payload).select('id').single();
    if (q.error) { $('msg').textContent = 'Save failed: ' + q.error.message; return; }
    id = q.data.id;
  }
  if (f) {
    $('msg').textContent = 'Uploading thumbnail...';
    const ext = (f.type || 'image/jpeg').split('/')[1]?.replace('jpeg', 'jpg') || 'jpg';
    const path = `drama/${id}.${ext}`;
    const up = await supabase.storage.from('thumbnails').upload(path, f, { contentType: f.type || 'image/jpeg', upsert: true, cacheControl: '31536000' });
    if (up.error) { $('msg').textContent = 'Drama saved, but thumbnail upload failed: ' + up.error.message; return; }
    const pub = supabase.storage.from('thumbnails').getPublicUrl(path).data.publicUrl;
    const uq = await supabase.from('Drama').update({ thumbnail_url: pub }).eq('id', id);
    if (uq.error) { $('msg').textContent = 'Thumbnail uploaded, but database update failed: ' + uq.error.message; return; }
  } else if (editingId && editingImage) {
    await supabase.from('Drama').update({ thumbnail_url: editingImage }).eq('id', id);
  }
  loadPromise = null; await load(true);
  $('msg').textContent = 'Saved successfully.';
  setTimeout(showAdmin, 400);
}

window.testThumbnailStorage = async function() {
  if (!authSession) { showLogin(); return; }
  const msg = $('migrationMsg'); if (!msg) return;
  msg.textContent = 'Testing thumbnails Storage bucket...';
  try {
    const testPath = `_migration_test/${Date.now()}.txt`;
    const blob = new Blob(['Pak Spotlight Storage test'], { type: 'text/plain' });
    const up = await supabase.storage.from('thumbnails').upload(testPath, blob, { contentType: 'text/plain', upsert: false, cacheControl: '3600' });
    if (up.error) throw up.error;
    await supabase.storage.from('thumbnails').remove([testPath]);
    msg.textContent = 'Storage test successful. The thumbnails bucket is working.';
  } catch (e) {
    console.error('Storage test failed', e);
    msg.textContent = 'Storage test failed: ' + (e.message || e);
  }
};

window.migrateThumbnails = async function() {
  if (!authSession) { showLogin(); return; }
  const btn = $('migrateBtn'), msg = $('migrationMsg');
  if (!btn || !msg) return;
  if (!confirm('Migrate all old Base64 thumbnails to Storage? Existing Drama records will not be deleted.')) return;
  btn.disabled = true;
  let done = 0, failed = 0;
  try {
    msg.textContent = 'Checking Storage bucket...';
    const testPath = `_migration_test/${Date.now()}.txt`;
    const testUp = await supabase.storage.from('thumbnails').upload(testPath, new Blob(['test'], { type: 'text/plain' }), { contentType: 'text/plain', upsert: false, cacheControl: '3600' });
    if (testUp.error) throw new Error('Storage bucket check failed: ' + testUp.error.message);
    await supabase.storage.from('thumbnails').remove([testPath]);

    const idsQ = await supabase.from('Drama').select('id').like('thumbnail_url', 'data:%');
    if (idsQ.error) throw idsQ.error;
    const ids = (idsQ.data || []).map(x => x.id).filter(Boolean);
    if (!ids.length) { msg.textContent = 'No old Base64 thumbnails found. Nothing to migrate.'; return; }
    msg.textContent = `Found ${ids.length} old thumbnail${ids.length === 1 ? '' : 's'}. Starting...`;

    for (let i = 0; i < ids.length; i++) {
      const id = ids[i];
      try {
        const q = await supabase.from('Drama').select('id,title,thumbnail_url').eq('id', id).single();
        if (q.error) throw q.error;
        const row = q.data;
        if (!row || !String(row.thumbnail_url || '').startsWith('data:')) continue;
        msg.textContent = `Migrating ${i + 1} of ${ids.length}: ${row.title || row.id}...`;
        const m = String(row.thumbnail_url).match(/^data:([^;,]+)?;base64,(.*)$/s);
        if (!m) throw new Error('Invalid Base64 data URL');
        const mime = m[1] || 'image/jpeg', b64 = m[2].replace(/\s/g, '');
        let binary;
        try { binary = atob(b64); } catch (e) { throw new Error('Invalid Base64 image data'); }
        const bytes = new Uint8Array(binary.length);
        const chunk = 32768;
        for (let j = 0; j < binary.length; j += chunk) {
          const end = Math.min(j + chunk, binary.length);
          for (let k = j; k < end; k++) bytes[k] = binary.charCodeAt(k);
        }
        const ext = (mime.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace(/[^a-z0-9]/gi, '') || 'jpg';
        const path = `migrated/${id}.${ext}`;
        const up = await supabase.storage.from('thumbnails').upload(path, new Blob([bytes], { type: mime }), { contentType: mime, upsert: true, cacheControl: '31536000' });
        if (up.error) throw new Error('Storage upload failed: ' + up.error.message);
        const pub = supabase.storage.from('thumbnails').getPublicUrl(path).data.publicUrl;
        if (!pub) throw new Error('Could not create public Storage URL');
        const uq = await supabase.from('Drama').update({ thumbnail_url: pub }).eq('id', id);
        if (uq.error) throw new Error('Database update failed: ' + uq.error.message);
        done++;
        msg.textContent = `Migrated ${done} of ${ids.length}: ${row.title || row.id}`;
      } catch (e) {
        failed++;
        console.error('Thumbnail migration failed', id, e);
        msg.textContent = `Skipped ${i + 1}/${ids.length} (${id}): ${e.message || e}`;
        await new Promise(r => setTimeout(r, 250));
      }
    }
    loadPromise = null; await load(true);
    msg.textContent = `Migration finished. ${done} migrated${failed ? `, ${failed} skipped` : ''}.`;
  } catch (e) {
    console.error(e);
    msg.textContent = 'Migration stopped: ' + (e.message || e);
  } finally { btn.disabled = false; }
};

window.showAdmin = async function() {
  const { data } = await supabase.auth.getSession();
  authSession = data.session || null;
  if (!authSession) { showLogin(); return; }
  await load();
  $('app').innerHTML = `<section><div class="admin-shell"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h1>Drama Admin</h1><div class="meta">Signed in as ${esc(authSession.user.email || 'Admin')}</div></div><button class="admin-btn" onclick="logoutAdmin()">LOG OUT</button></div><button class="gold" onclick="adminForm()">+ ADD DRAMA</button><div class="panel" style="margin-top:16px"><h2>Thumbnail Migration</h2><p class="meta">Move old Base64 thumbnails from the Drama table into the public <b>thumbnails</b> Storage bucket. Existing Drama records are preserved.</p><button class="admin-btn" onclick="testThumbnailStorage()">TEST STORAGE</button> <button class="admin-btn" id="migrateBtn" onclick="migrateThumbnails()">MIGRATE OLD THUMBNAILS</button><div id="migrationMsg" class="meta" style="margin-top:10px"></div></div><div id="adminList"></div></div></section>`;
  renderAdmin();
};

function showLogin() {
  $('app').innerHTML = `<section><div class="auth-box"><a class="watch" href="#" onclick="goHome();return false">← WEBSITE</a><h1>Admin Login</h1><p class="meta">Admin access is restricted. Sign in to manage dramas.</p><form id="loginForm"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required placeholder="admin@example.com"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Password"><div class="actions"><button class="btn gold" type="submit">SIGN IN</button><button class="btn" type="button" onclick="goHome()">CANCEL</button></div><div id="loginMsg" class="auth-error"></div></form></div></section>`;
  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    $('loginMsg').textContent = 'Signing in…';
    const q = await supabase.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
    if (q.error) { $('loginMsg').textContent = 'Login failed: ' + q.error.message; return; }
    authSession = q.data.session;
    showAdmin();
  };
}

window.logoutAdmin = async function() { await supabase.auth.signOut(); authSession = null; goHome(); };

window.adminForm = async function(d = null) { if (!authSession) { showLogin(); return; } return adminForm(d); };

function renderAdmin() {
  const list = $('adminList'), gs = groups(rows);
  list.innerHTML = gs.length ? gs.map(g => `<div class="drama-row"><div><b>${esc(isSeries(g[0]) && g[0].series ? g[0].series : g[0].title)}</b><div class="meta">${esc(g[0].type)} · ${g.length} item${g.length === 1 ? '' : 's'}</div>${g.length > 1 ? `<div class="admin-episodes">${g.map(e => 'Episode ' + (e.episode ?? '?') + ' — ' + esc(e.title)).join('<br>')}</div>` : ''}</div><div class="actions">${g.map(e => `<button onclick="adminEdit('${encodeURIComponent(String(e.id))}')">EDIT${e.episode ? ' E' + e.episode : ''}</button><button class="danger" onclick="adminDelete('${encodeURIComponent(String(e.id))}')">DELETE${e.episode ? ' E' + e.episode : ''}</button>`).join('')}</div></div>`).join('') : '<div class="empty">No dramas yet.</div>';
}

window.adminEdit = id => { if (!authSession) { showLogin(); return; } const d = rows.find(x => String(x.id) === decodeURIComponent(id)); if (d) adminForm(d); };
window.adminDelete = async id => {
  if (!authSession) { showLogin(); return; }
  const d = rows.find(x => String(x.id) === decodeURIComponent(id));
  if (!d || !confirm('Delete ' + d.title + '?')) return;
  const q = await supabase.from('Drama').delete().eq('id', d.id);
  if (q.error) { alert('Delete failed: ' + q.error.message); return; }
  loadPromise = null; await load(true); showAdmin();
};

supabase.auth.getSession().then(({ data }) => { authSession = data.session || null; }).catch(() => {});
supabase.auth.onAuthStateChange((_event, session) => { authSession = session || null; });

$('app').innerHTML = '<section class="hero"><div class="hero-copy"><div class="tag">CLASSIC PAKISTANI TELEVISION</div><h1>PAK SPOTLIGHT</h1><p>Loading the archive…</p></div></section>';
load().then(() => { home(rows); scheduleThumbs(); }).catch(e => { console.error(e); home(rows); });
</script>
