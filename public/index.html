<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pak Spotlight — Classic PTV Drama Stream & Archive</title>
<meta name="description" content="Stream the golden age of Pakistani television (PTV). Classic drama serials, legendary long plays, telefilms, and comedy masterpieces in a Netflix-style theater experience.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Noto+Nastaliq+Urdu:wght@500;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #060b08;
  --bg-surface: #0e1712;
  --bg-card: #121f18;
  --bg-card-hover: #17271f;
  --border: #203529;
  --border-gold: rgba(245, 197, 66, 0.35);
  --gold: #f5c542;
  --gold-hover: #ffd768;
  --gold-glow: rgba(245, 197, 66, 0.2);
  --emerald-accent: #2e7d4d;
  --text-primary: #fbf9f4;
  --text-muted: #9eb0a5;
  --text-dim: #677b70;
  --font-serif: 'Cinzel', 'Playfair Display', Georgia, serif;
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-urdu: 'Noto Nastaliq Urdu', serif;
  --radius-lg: 16px;
  --radius-md: 10px;
  --radius-sm: 6px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background-color: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  line-height: 1.6;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 85% 10%, rgba(46, 125, 77, 0.16) 0%, transparent 45%),
    radial-gradient(circle at 10% 45%, rgba(245, 197, 66, 0.07) 0%, transparent 40%);
  background-attachment: fixed;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: inherit; }

/* Top Navigation Bar (Netflix Glassmorphism Style) */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 200;
  padding: 14px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  transition: background 0.35s ease, padding 0.35s ease;
  background: linear-gradient(180deg, rgba(6, 11, 8, 0.95) 0%, rgba(6, 11, 8, 0.7) 60%, transparent 100%);
}
.topbar.scrolled {
  background: rgba(6, 11, 8, 0.96);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 10px 5%;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
}
.brand-group {
  display: flex;
  align-items: center;
  gap: 32px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  flex-shrink: 0;
}
.brand-logo {
  width: 44px;
  height: 44px;
  object-fit: contain;
  filter: drop-shadow(0 2px 10px rgba(245, 197, 66, 0.35));
  transition: transform 0.3s ease;
}
.brand:hover .brand-logo {
  transform: scale(1.05) rotate(-2deg);
}
.brand-titles {
  display: flex;
  flex-direction: column;
}
.brand-name {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #fff;
  line-height: 1.1;
}
.brand-sub {
  font-size: 9px;
  color: var(--gold);
  letter-spacing: 1.6px;
  text-transform: uppercase;
  font-weight: 700;
  margin-top: 2px;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
}
.nav-link {
  transition: color 0.2s ease;
  white-space: nowrap;
}
.nav-link:hover, .nav-link.active {
  color: var(--gold);
}

/* Topbar Actions (Search + Admin) */
.topbar-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.search-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}
.search-input {
  background: rgba(14, 23, 18, 0.85);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 36px 8px 36px;
  color: #fff;
  font-size: 13px;
  width: 220px;
  transition: all 0.3s ease;
}
.search-input:focus {
  width: 280px;
  border-color: var(--gold);
  background: #09110c;
  outline: none;
  box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.12);
}
.search-icon-svg {
  position: absolute;
  left: 12px;
  color: var(--text-dim);
  pointer-events: none;
}
.search-clear-btn {
  position: absolute;
  right: 12px;
  background: none;
  color: var(--text-dim);
  font-size: 12px;
  display: none;
}
.search-clear-btn.visible { display: block; }

/* Mobile Category Navigation Strip */
.mobile-nav-strip {
  display: none;
  gap: 8px;
  overflow-x: auto;
  white-space: nowrap;
  padding: 8px 5%;
  background: rgba(6, 11, 8, 0.95);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 56px;
  z-index: 180;
}
.mobile-nav-strip::-webkit-scrollbar { display: none; }
.m-pill {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s;
  cursor: pointer;
}
.m-pill:hover, .m-pill.active {
  background: rgba(245, 197, 66, 0.15);
  border-color: var(--gold);
  color: var(--gold);
}

/* ============================================================
   NETFLIX BILLBOARD / HERO SECTION
   ============================================================ */
.billboard {
  position: relative;
  min-height: 80vh;
  display: flex;
  align-items: flex-end;
  padding: 120px 5% 70px;
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
  overflow: hidden;
}
.billboard::before {
  content: "";
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(90deg, rgba(6, 11, 8, 0.95) 0%, rgba(6, 11, 8, 0.75) 45%, rgba(6, 11, 8, 0.25) 100%),
    linear-gradient(0deg, #060b08 0%, rgba(6, 11, 8, 0.8) 25%, transparent 60%);
  z-index: 1;
}
.billboard-content {
  position: relative;
  z-index: 2;
  max-width: 720px;
}
.billboard-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--gold);
  text-transform: uppercase;
  background: rgba(245, 197, 66, 0.12);
  border: 1px solid rgba(245, 197, 66, 0.4);
  padding: 5px 14px;
  border-radius: 999px;
  margin-bottom: 16px;
  backdrop-filter: blur(8px);
}
.billboard-title {
  font-family: var(--font-serif);
  font-size: clamp(36px, 5.5vw, 64px);
  font-weight: 900;
  line-height: 1.05;
  color: #fff;
  letter-spacing: 1px;
  margin-bottom: 6px;
  text-shadow: 0 4px 18px rgba(0,0,0,0.8);
}
.billboard-urdu {
  font-family: var(--font-urdu);
  font-size: clamp(24px, 3.5vw, 36px);
  color: var(--gold);
  direction: rtl;
  margin-bottom: 14px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.7);
}
.billboard-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.meta-chip {
  padding: 3px 9px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.meta-chip-gold {
  background: var(--gold);
  color: #0b110e;
}
.meta-chip-outline {
  border: 1px solid rgba(255, 255, 255, 0.35);
  background: rgba(0, 0, 0, 0.4);
}
.billboard-desc {
  font-size: clamp(14px, 1.4vw, 16px);
  color: var(--text-muted);
  line-height: 1.6;
  max-width: 640px;
  margin-bottom: 26px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}
.billboard-actions {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.btn-play {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(135deg, #f5c542 0%, #d4a024 100%);
  color: #080e0a;
  font-size: 15px;
  font-weight: 800;
  padding: 13px 28px;
  border-radius: 8px;
  letter-spacing: 0.5px;
  box-shadow: 0 6px 20px rgba(245, 197, 66, 0.35);
  transition: all 0.25s ease;
}
.btn-play:hover {
  background: linear-gradient(135deg, #ffd768 0%, #e5b334 100%);
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(245, 197, 66, 0.5);
}
.btn-info {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  padding: 13px 26px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(10px);
  transition: all 0.25s ease;
}
.btn-info:hover {
  background: rgba(255, 255, 255, 0.22);
  border-color: rgba(245, 197, 66, 0.5);
  color: var(--gold);
  transform: translateY(-2px);
}

/* ============================================================
   NETFLIX CATEGORY ROWS / CAROUSELS
   ============================================================ */
.rows-container {
  padding: 20px 5% 60px;
  display: flex;
  flex-direction: column;
  gap: 36px;
}
.row-section {
  position: relative;
}
.row-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}
.row-title {
  font-family: var(--font-serif);
  font-size: clamp(19px, 2.2vw, 24px);
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.row-count-badge {
  font-size: 11px;
  font-weight: 700;
  color: var(--gold);
  background: rgba(245, 197, 66, 0.1);
  border: 1px solid rgba(245, 197, 66, 0.3);
  padding: 2px 8px;
  border-radius: 999px;
}
.row-see-all {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  transition: color 0.2s;
}
.row-see-all:hover {
  color: var(--gold);
}

/* Carousel Track & Navigation Chevrons */
.carousel-wrap {
  position: relative;
  overflow: visible;
}
.carousel-track {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-behavior: smooth;
  padding: 12px 2px 20px;
  scrollbar-width: none; /* Firefox */
  -webkit-overflow-scrolling: touch;
}
.carousel-track::-webkit-scrollbar { display: none; }

.chevron-btn {
  position: absolute;
  top: 12px;
  bottom: 20px;
  width: 46px;
  z-index: 10;
  background: rgba(6, 11, 8, 0.82);
  color: #fff;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.25s ease, background 0.2s;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.carousel-wrap:hover .chevron-btn {
  opacity: 1;
}
.chevron-btn:hover {
  background: rgba(245, 197, 66, 0.85);
  color: #0b110e;
  border-color: var(--gold);
}
.chevron-left { left: -18px; }
.chevron-right { right: -18px; }

/* ============================================================
   NETFLIX POSTER CARD
   ============================================================ */
.netflix-card {
  flex: 0 0 260px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s, border-color 0.3s;
  position: relative;
  display: flex;
  flex-direction: column;
}
.netflix-card:hover {
  transform: scale(1.06) translateY(-4px);
  z-index: 5;
  border-color: rgba(245, 197, 66, 0.6);
  box-shadow: 0 14px 32px rgba(0, 0, 0, 0.7), 0 0 24px rgba(245, 197, 66, 0.2);
  background: var(--bg-card-hover);
}
.card-media {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #080f0b;
  overflow: hidden;
}
.card-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}
.netflix-card:hover .card-media img {
  transform: scale(1.05);
}
.card-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 14px;
  background: linear-gradient(135deg, #102217 0%, #080f0b 100%);
}
.card-fallback-icon {
  font-size: 28px;
  margin-bottom: 4px;
}
.card-fallback-text {
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
}
.card-play-hover {
  position: absolute;
  inset: 0;
  background: rgba(6, 11, 8, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.netflix-card:hover .card-play-hover {
  opacity: 1;
}
.card-play-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--gold);
  color: #0b110e;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 16px rgba(245, 197, 66, 0.5);
}
.card-info {
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.card-title-line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
}
.card-title {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-urdu {
  font-family: var(--font-urdu);
  font-size: 14px;
  color: var(--gold);
  direction: rtl;
  white-space: nowrap;
}
.card-meta-line {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.card-tag {
  font-size: 10px;
  font-weight: 700;
  color: var(--gold);
}

/* ============================================================
   GRID BROWSE VIEW (FOR SEARCH & CATEGORY PAGES)
   ============================================================ */
.browse-view {
  padding: 100px 5% 60px;
  max-width: 1340px;
  margin: 0 auto;
  width: 100%;
}
.browse-header {
  margin-bottom: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.browse-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.browse-title {
  font-family: var(--font-serif);
  font-size: clamp(24px, 3.5vw, 36px);
  font-weight: 800;
  color: #fff;
}
.filter-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-pill {
  background: var(--bg-surface);
  color: var(--text-muted);
  border: 1px solid var(--border);
  padding: 7px 16px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s;
}
.filter-pill:hover, .filter-pill.active {
  background: rgba(245, 197, 66, 0.15);
  border-color: var(--gold);
  color: var(--gold);
}
.browse-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}

/* ============================================================
   NETFLIX MODAL / MORE INFO DIALOG
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}
.modal-overlay.open {
  display: flex;
}
.modal-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-lg);
  max-width: 920px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(245, 197, 66, 0.15);
  animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modalFadeIn {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-close-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 20;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(6, 11, 8, 0.8);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
}
.modal-close-btn:hover {
  background: var(--gold);
  color: #0b110e;
}
.modal-video-wrap {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 16:9 */
  background: #000;
}
.modal-video-wrap iframe {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  border: 0;
}
.modal-body {
  padding: 26px 32px 36px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.modal-title-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}
.modal-title {
  font-family: var(--font-serif);
  font-size: clamp(24px, 3vw, 34px);
  font-weight: 800;
  color: #fff;
}
.modal-urdu {
  font-family: var(--font-urdu);
  font-size: 26px;
  color: var(--gold);
  direction: rtl;
}
.modal-meta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 12px;
}
.modal-desc {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.7;
}

/* Episodes Drawer (Netflix List Style) */
.episodes-section {
  border-top: 1px solid var(--border);
  padding-top: 20px;
}
.episodes-header {
  font-family: var(--font-serif);
  font-size: 18px;
  color: #fff;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.episodes-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 280px;
  overflow-y: auto;
}
.episode-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.episode-row:hover, .episode-row.active {
  background: var(--bg-card-hover);
  border-color: var(--gold);
}
.episode-row.active {
  background: rgba(245, 197, 66, 0.1);
}
.ep-number {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 800;
  color: var(--gold);
  min-width: 24px;
}
.ep-title-box {
  flex: 1;
}
.ep-name {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
}
.ep-sub {
  font-size: 11px;
  color: var(--text-dim);
}
.ep-play-btn {
  font-size: 12px;
  font-weight: 700;
  color: var(--gold);
}

/* Credits Strip */
.credits-box {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  font-size: 12px;
}
.credit-item b {
  display: block;
  color: var(--text-dim);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 2px;
}
.credit-item span {
  color: var(--text-primary);
  font-weight: 500;
}

/* Footer */
footer {
  border-top: 1px solid var(--border);

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://whcseoasnaswlhnzduix.supabase.co";
const SUPABASE_KEY = "sb_publishable_fkK2ryuBKr0WK96m34Cczg_7ofQBaOk";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let rows = [];
let viewMode = "home"; // "home" | "category" | "search"
let activeCategory = "all";
let currentDetailDrama = null;
let currentPlayingYt = "";

function mapRow(r) {
  return {
    id: r.id,
    title: r.title ?? r.Title ?? "",
    urdu: r.urdu_title ?? r.urdu ?? r.Urdu ?? "",
    year: r.year ?? "",
    type: r.type ?? "Long Play",
    writer: r.writer ?? "",
    produced: r.produced ?? "",
    director: r.director ?? "",
    cast: r.cast ?? "",
    description: r.description ?? "",
    youtube: r.youtube_url ?? r.youtube ?? "",
    image: r.thumbnail_url ?? r.image ?? r.thumbnail ?? "",
    series: r.series_name ?? "",
    episode: r.episode_number == null ? null : Number(r.episode_number)
  };
}

function normalize(s) {
  return String(s ?? "").replace(/\s+/g, " ").trim().toLowerCase();
}

function isSeries(d) {
  return ["Serial / Series", "Series", "Serial", "Comedy"].includes(String(d.type || ""));
}

function extractYouTubeId(url) {
  if (!url) return "";
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtu.be")) return u.pathname.split("/").filter(Boolean)[0] || "";
    if (u.hostname.includes("youtube.com")) {
      if (u.pathname === "/watch") return u.searchParams.get("v") || "";
      const parts = u.pathname.split("/").filter(Boolean);
      const i = parts.findIndex(x => ["embed", "shorts", "live"].includes(x));
      if (i >= 0) return parts[i + 1] || "";
      return u.searchParams.get("v") || parts.pop() || "";
    }
  } catch {
    const m = String(url).match(/[A-Za-z0-9_-]{11}/);
    return m ? m[0] : "";
  }
  return "";
}

function groupDramas(list) {
  const map = new Map();
  for (const d of list) {
    const seriesName = isSeries(d) && String(d.series || "").trim();
    const key = seriesName ? "series:" + String(d.type).trim().toLowerCase() + ":" + normalize(seriesName) : "id:" + d.id;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(d);
  }
  return [...map.values()].map(g => g.sort((a, b) => (a.episode ?? 999999) - (b.episode ?? 999999)));
}

async function loadData() {
  let q = await supabase.from("Drama").select("id,title,urdu_title,year,type,writer,director,produced,cast,description,youtube_url,series_name,episode_number,thumbnail_url");
  if (q.error) q = await supabase.from("Drama").select("*");
  if (q.error) { console.error(q.error); return []; }
  rows = (q.data || []).map(mapRow);
  return rows;
}

// ----------------------
// NETFLIX BILLBOARD + ROWS HOME VIEW
// ----------------------
function renderNetflixHome() {
  viewMode = "home";
  document.title = "Pak Spotlight — Classic PTV Drama Stream";

  // Pick a featured drama with a high-res thumbnail for the billboard
  const featured = rows.find(r => r.image && r.title && r.description) || rows[0] || {};
  const isSer = isSeries(featured) && !!featured.series;
  const fTitle = isSer ? featured.series : featured.title;
  const fYt = extractYouTubeId(featured.youtube);

  // Filter lists for rows
  const allGroups = groupDramas(rows);
  const serials = allGroups.filter(g => ["Serial / Series", "Series", "Serial"].includes(g[0].type));
  const longPlays = allGroups.filter(g => g[0].type === "Long Play");
  const comedies = allGroups.filter(g => g[0].type === "Comedy");
  const shorts = allGroups.filter(g => g[0].type === "Shorts");
  const eightiesNineties = allGroups.filter(g => {
    const y = parseInt(g[0].year) || 0;
    return y >= 1970 && y <= 1999;
  });

  $("app").innerHTML = `
    <!-- Billboard Hero -->
    <section class="billboard" style="background-image: url('${featured.image || '/logo.png'}')">
      <div class="billboard-content">
        <div class="billboard-badge">★ PTV GOLDEN ERA SPOTLIGHT</div>
        <h1 class="billboard-title">${esc(fTitle)}</h1>
        ${featured.urdu ? `<div class="billboard-urdu">${esc(featured.urdu)}</div>` : ''}
        <div class="billboard-meta">
          <span class="meta-chip meta-chip-gold">${esc(featured.type)}</span>
          ${featured.year ? `<span class="meta-chip meta-chip-outline">${esc(featured.year)}</span>` : ''}
          ${isSer && featured.episode ? `<span class="meta-chip meta-chip-outline">Episode ${featured.episode}</span>` : ''}
          ${featured.writer ? `<span style="color:var(--text-muted)">Writer: ${esc(featured.writer)}</span>` : ''}
        </div>
        <p class="billboard-desc">${esc(featured.description || "A celebrated masterpiece from the golden archive of Pakistani television, renowned for its brilliant writing and legendary performances.")}</p>
        <div class="billboard-actions">
          <button class="btn-play" onclick="openDramaModal(${featured.id}, true)">
            ▶ PLAY NOW
          </button>
          <button class="btn-info" onclick="openDramaModal(${featured.id}, false)">
            ⓘ MORE DETAILS
          </button>
        </div>
      </div>
    </section>

    <!-- Horizontal Netflix Rows -->
    <div class="rows-container">
      ${serials.length ? renderCarouselRow("Popular Drama Serials", "serials", serials) : ''}
      ${longPlays.length ? renderCarouselRow("Masterpiece Long Plays & Telefilms", "longplays", longPlays) : ''}
      ${comedies.length ? renderCarouselRow("Classic Comedy & Satire", "comedy", comedies) : ''}
      ${eightiesNineties.length ? renderCarouselRow("Golden Age: 70s, 80s & 90s Classics", "vintage", eightiesNineties) : ''}
      ${shorts.length ? renderCarouselRow("Shorts & Mini Features", "shorts", shorts) : ''}
      ${renderCarouselRow("Complete Masterpiece Collection", "all", allGroups)}
    </div>
  `;

  bindCarouselArrows();
}

function renderCarouselRow(title, rowId, groupList) {
  return `
    <div class="row-section">
      <div class="row-header">
        <h2 class="row-title">
          <span>${title}</span>
          <span class="row-count-badge">${groupList.length}</span>
        </h2>
      </div>
      <div class="carousel-wrap">
        <button class="chevron-btn chevron-left" onclick="scrollCarousel('${rowId}', -1)">❮</button>
        <div class="carousel-track" id="track-${rowId}">
          ${groupList.map(g => renderNetflixCard(g)).join("")}
        </div>
        <button class="chevron-btn chevron-right" onclick="scrollCarousel('${rowId}', 1)">❯</button>
      </div>
    </div>
  `;
}

function renderNetflixCard(g) {
  const d = g[0];
  const isSer = isSeries(d) && !!String(d.series || "").trim();
  const title = isSer ? d.series : d.title;
  const count = g.length;

  return `
    <div class="netflix-card" onclick="openDramaModal(${d.id})">
      <div class="card-media">
        ${d.image ? `
          <img src="${esc(d.image)}" alt="${esc(title)}" loading="lazy">
        ` : `
          <div class="card-fallback">
            <div class="card-fallback-icon">🎬</div>
            <div class="card-fallback-text">${esc(title)}</div>
          </div>
        `}
        <div class="card-play-hover">
          <div class="card-play-btn">▶</div>
        </div>
      </div>
      <div class="card-info">
        <div class="card-title-line">
          <div class="card-title">${esc(title)}</div>
          ${d.urdu ? `<div class="card-urdu">${esc(d.urdu)}</div>` : ''}
        </div>
        <div class="card-meta-line">
          <span class="card-tag">${esc(d.type)}</span>
          ${d.year ? `<span>· ${esc(d.year)}</span>` : ''}
          ${isSer && count > 1 ? `<span>· ${count} Eps</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

window.scrollCarousel = function(rowId, direction) {
  const track = $(`track-${rowId}`);
  if (!track) return;
  const scrollAmount = 800 * direction;
  track.scrollBy({ left: scrollAmount, behavior: "smooth" });
};

function bindCarouselArrows() {}

// ----------------------
// BROWSE / GRID VIEW (FOR CATEGORY & SEARCH)
// ----------------------
function renderBrowseGrid(title, items, showPills = true) {
  viewMode = "category";

  $("app").innerHTML = `
    <div class="browse-view">
      <div class="browse-header">
        <div class="browse-title-row">
          <h1 class="browse-title">${esc(title)}</h1>
          <span style="font-size:13px;color:var(--text-muted)">${items.length} ${items.length === 1 ? 'classic' : 'classics'} found</span>
        </div>
        ${showPills ? `
          <div class="filter-pills">
            <button class="filter-pill ${activeCategory === 'all' ? 'active' : ''}" onclick="showCategoryView('all')">All</button>
            <button class="filter-pill ${activeCategory === 'Serial / Series' ? 'active' : ''}" onclick="showCategoryView('Serial / Series')">Drama Serials</button>
            <button class="filter-pill ${activeCategory === 'Long Play' ? 'active' : ''}" onclick="showCategoryView('Long Play')">Long Plays</button>
            <button class="filter-pill ${activeCategory === 'Comedy' ? 'active' : ''}" onclick="showCategoryView('Comedy')">Comedy</button>
            <button class="filter-pill ${activeCategory === 'Shorts' ? 'active' : ''}" onclick="showCategoryView('Shorts')">Shorts</button>
          </div>
        ` : ''}
      </div>

      <div class="browse-grid">
        ${items.length ? items.map(g => renderNetflixCard(g)).join("") : `
          <div style="grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--text-muted);border:1px dashed var(--border);border-radius:12px">
            <div style="font-size:36px;margin-bottom:8px">📺</div>
            <div style="font-family:var(--font-serif);font-size:18px;color:#fff">No dramas found</div>
            <p style="font-size:13px;margin-top:4px">Try adjusting your search query or choosing another category.</p>
          </div>
        `}
      </div>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ----------------------
// NETFLIX MODAL & VIDEO PLAYER
// ----------------------
window.openDramaModal = function(id, autoplay = true) {
  const d = rows.find(r => r.id === Number(id));
  if (!d) return;
  currentDetailDrama = d;

  const isSer = isSeries(d) && !!String(d.series || "").trim();
  const episodes = isSer 
    ? rows.filter(x => normalize(x.series) === normalize(d.series) && String(x.type) === String(d.type)).sort((a, b) => (a.episode ?? 9999) - (b.episode ?? 9999))
    : [d];

  const initialEp = (extractYouTubeId(d.youtube) ? d : null) || episodes.find(e => extractYouTubeId(e.youtube)) || d;
  const initialYt = extractYouTubeId(initialEp.youtube);
  currentPlayingYt = initialYt;

  // Iframe player
  $("modalPlayerWrap").innerHTML = initialYt ? `
    <iframe id="modalIframe" src="https://www.youtube.com/embed/${initialYt}?rel=0&autoplay=${autoplay ? '1' : '0'}" title="${esc(d.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  ` : `
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0c140f;color:var(--text-muted)">
      <span style="font-size:36px">🎬</span>
      <span style="font-size:14px;color:#fff;margin-top:8px">Streaming stream being remastered</span>
    </div>
  `;

  // Body content
  $("modalBody").innerHTML = `
    <div class="modal-title-row">
      <div>
        <h2 class="modal-title">${esc(isSer ? d.series : d.title)}</h2>
        <div class="modal-meta-row" style="margin-top:4px">
          <span class="meta-chip meta-chip-gold">${esc(d.type)}</span>
          ${d.year ? `<span class="meta-chip meta-chip-outline">${esc(d.year)}</span>` : ''}
          ${isSer && episodes.length ? `<span class="meta-chip meta-chip-outline">${episodes.length} Episodes</span>` : ''}
        </div>
      </div>
      ${d.urdu ? `<div class="modal-urdu">${esc(d.urdu)}</div>` : ''}
    </div>

    <p class="modal-desc">${esc(d.description || "A cornerstone classic from Pakistan Television's golden era, celebrated for its brilliant dialogue, compelling characters, and timeless cultural resonance.")}</p>

    <!-- Series Episodes Drawer (if multi-episode) -->
    ${isSer && episodes.length > 1 ? `
      <div class="episodes-section">
        <div class="episodes-header">
          <span>Episodes (${episodes.length})</span>
          <span style="font-size:12px;color:var(--gold)">Click to switch episode</span>
        </div>
        <div class="episodes-list">
          ${episodes.map((ep, idx) => {
            const epYt = extractYouTubeId(ep.youtube);
            const epNum = ep.episode ?? (idx + 1);
            const isPlaying = (ep.id === initialEp.id);
            return `
              <div class="episode-row ${isPlaying ? 'active' : ''}" onclick="switchModalEpisode('${epYt}', this)">
                <span class="ep-number">${epNum}</span>
                <div class="ep-title-box">
                  <div class="ep-name">${esc(ep.title)}</div>
                  <div class="ep-sub">${ep.year ? 'Year: ' + esc(ep.year) : 'Classic Episode'}</div>
                </div>
                <div class="ep-play-btn">▶ PLAY</div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    ` : ''}

    <!-- Credits Box -->
    <div class="credits-box">
      ${d.writer ? `<div class="credit-item"><b>Writer / Playwright</b><span>${esc(d.writer)}</span></div>` : ''}
      ${d.director ? `<div class="credit-item"><b>Director</b><span>${esc(d.director)}</span></div>` : ''}
      ${d.produced ? `<div class="credit-item"><b>Produced By</b><span>${esc(d.produced)}</span></div>` : ''}
      ${d.cast ? `<div class="credit-item" style="grid-column:1/-1"><b>Star Cast</b><span>${esc(d.cast)}</span></div>` : ''}
    </div>
  `;

  $("detailModal").classList.add("open");
  document.body.style.overflow = "hidden";

  // Update hash
  try { history.pushState(null, "", `#drama-${d.id}`); } catch {}
};

window.switchModalEpisode = function(ytId, el) {
  if (!ytId) return;
  const iframe = $("modalIframe");
  if (iframe) {
    iframe.src = `https://www.youtube.com/embed/${ytId}?rel=0&autoplay=1`;
  }
  document.querySelectorAll(".episode-row").forEach(r => r.classList.remove("active"));
  if (el) el.classList.add("active");
};

function closeModal() {
  const modal = $("detailModal");
  modal.classList.remove("open");
  $("modalPlayerWrap").innerHTML = ""; // Stop video playback
  document.body.style.overflow = "";
  try { history.pushState(null, "", window.location.pathname); } catch {}
}

$("modalClose").onclick = closeModal;
$("detailModal").onclick = e => {
  if (e.target === $("detailModal")) closeModal();
};
window.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

// ----------------------
// NAVIGATION & SEARCH HANDLERS
// ----------------------
window.showHomeView = function() {
  activeCategory = "all";
  updateNavActive("navHome");
  renderNetflixHome();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

window.showCategoryView = function(category) {
  activeCategory = category;
  if (category === "all") {
    showHomeView();
    return;
  }
  const navMap = {
    "Serial / Series": "navSerials",
    "Long Play": "navLong",
    "Comedy": "navComedy",
    "Shorts": "navShorts"
  };
  updateNavActive(navMap[category]);

  const allGroups = groupDramas(rows);
  let filtered = allGroups;
  if (category !== "all") {
    filtered = allGroups.filter(g => 
      category === "Serial / Series" 
        ? ["Serial / Series", "Series", "Serial"].includes(g[0].type)
        : g[0].type === category
    );
  }

  renderBrowseGrid(category === "all" ? "All Dramas" : category, filtered, true);
};

function updateNavActive(id) {
  document.querySelectorAll(".nav-link").forEach(l => l.classList.remove("active"));
  document.querySelectorAll(".m-pill").forEach(p => p.classList.remove("active"));
  if ($(id)) $(id).classList.add("active");
  const mId = id ? "m" + id.charAt(0).toUpperCase() + id.slice(1) : "";
  if ($(mId)) $(mId).classList.add("active");
}

// Global search
const searchInput = $("globalSearch");
const searchClear = $("searchClear");

searchInput.oninput = () => {
  const q = searchInput.value.trim().toLowerCase();
  searchClear.className = q ? "search-clear-btn visible" : "search-clear-btn";

  if (!q) {
    if (activeCategory === "all") renderNetflixHome();
    else showCategoryView(activeCategory);
    return;
  }

  const matches = rows.filter(d => 
    (d.title + " " + d.urdu + " " + d.writer + " " + d.director + " " + d.cast + " " + d.year + " " + d.type + " " + d.series).toLowerCase().includes(q)
  );
  const grouped = groupDramas(matches);
  renderBrowseGrid(`Search Results for "${searchInput.value}"`, grouped, false);
};

searchClear.onclick = () => {
  searchInput.value = "";
  searchClear.className = "search-clear-btn";
  if (activeCategory === "all") renderNetflixHome();
  else showCategoryView(activeCategory);
};

// Navbar background fade on scroll
window.addEventListener("scroll", () => {
  const topbar = $("mainTopbar");
  if (window.scrollY > 40) topbar.classList.add("scrolled");
  else topbar.classList.remove("scrolled");
});

// Deep linking
function checkHash() {
  const hash = window.location.hash || "";
  if (hash.startsWith("#drama-")) {
    const id = hash.replace("#drama-", "");
    openDramaModal(id, true);
  }
}
window.addEventListener("hashchange", checkHash);

// Initialize
loadData().then(() => {
  renderNetflixHome();
  checkHash();
}).catch(e => {
  console.error(e);
  renderNetflixHome();
});
</script>
</body>
</html>
