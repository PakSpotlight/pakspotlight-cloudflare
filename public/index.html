<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://whcseoasnaswlhnzduix.supabase.co","sb_publishable_fkK2ryuBKr0WK96m34Cczg_7ofQBaOk");
const $=id=>document.getElementById(id); const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[],editingId=null,editingImage="",loadPromise=null,viewMode="home",viewType="",dataReady=false;
let authSession=null;
function map(r){return {id:r.id,title:r.title??r.Title??"",urdu:r.urdu_title??r.urdu??r.Urdu??"",year:r.year??"",type:r.type??"",writer:r.writer??"",produced:r.produced??"",director:r.director??"",cast:r.cast??"",description:r.description??"",youtube:r.youtube_url??r.youtube??"",image:r.thumbnail_url??r.image??r.thumbnail??"",series:r.series_name??"",episode:r.episode_number==null?null:Number(r.episode_number)}}
function normalize(s){return String(s??"").replace(/\s+/g," ").trim().toLowerCase()}
async function load(force=false){
  if(loadPromise&&!force)return loadPromise;
  loadPromise=(async()=>{
    let q=await supabase.from("Drama").select("id,title,urdu_title,year,type,writer,director,cast,description,youtube_url,series_name,episode_number");
    if(q.error){console.warn("Fast Drama query failed; using full Drama query",q.error);q=await supabase.from("Drama").select("*")}
    if(q.error){console.error("Drama load failed",q.error);dataReady=false;return rows}
    rows=(q.data||[]).map(map);dataReady=true;
    
    return rows;
  })();
  return loadPromise;
}
function scheduleThumbs(){setTimeout(()=>hydrateThumbs(),100)}
async function hydrateThumbs(){
  const ids=rows.map(r=>r.id).filter(Boolean);if(!ids.length)return;
  // Thumbnails are stored as image data in the database. Never include them in the
  // initial archive query; fetch small groups in parallel so the page appears fast.
  const batches=[];for(let i=0;i<ids.length;i+=4)batches.push(ids.slice(i,i+4));
  for(let start=0;start<batches.length;start+=4){
    const group=batches.slice(start,start+4);
    await Promise.all(group.map(async batch=>{
      try{
        const q=await supabase.from("Drama").select("id,thumbnail_url").in("id",batch);
        if(!q.error){
          const im=new Map((q.data||[]).map(x=>[String(x.id),x.thumbnail_url||""]));
          rows.forEach(r=>{if(im.has(String(r.id)))r.image=im.get(String(r.id))});
          if(viewMode==="home" && document.visibilityState!=="hidden") renderHomeInPlace();
        }
      }catch(e){console.warn("Thumbnail load failed",e)}
    }));
  }
}
function isSeries(d){return ["Serial / Series","Series","Serial","Comedy"].includes(String(d.type||""))}
function yt(url){try{const u=new URL(url);if(u.hostname.includes("youtu.be"))return u.pathname.split("/").filter(Boolean)[0]||"";if(u.hostname.includes("youtube.com")){if(u.pathname==="/watch")return u.searchParams.get("v")||"";const parts=u.pathname.split("/").filter(Boolean);const i=parts.findIndex(x=>["embed","shorts","live"].includes(x));if(i>=0)return parts[i+1]||"";return u.searchParams.get("v")||parts.pop()||""}return ""}catch{return ""}}
function poster(d,extra=""){return d.image?`<div class="poster ${extra}"><img src="${esc(d.image)}" alt="${esc(d.title)}" decoding="async"></div>`:`<div class="poster ${extra}"><b>${esc(d.title)}</b></div>`}
function groups(list){const m=new Map();for(const d of list){const series=isSeries(d)&&String(d.series||"").trim();const key=series?"series:"+String(d.type).trim().toLowerCase()+":"+normalize(series):"id:"+d.id;if(!m.has(key))m.set(key,[]);m.get(key).push(d)}return [...m.values()].map(g=>g.sort((a,b)=>(a.episode??999999)-(b.episode??999999)))}
function updateSEO(d=null){
  const base='https://pak-spotlight.pakifun3.workers.dev/';
  const title=d?(isSeries(d)&&d.series?`${d.series} — Pak Spotlight`:`${d.title} — Pak Spotlight`):'Pak Spotlight — Classic PTV Drama Archive';
  const desc=d?(String(d.description||'').trim()||`Watch ${isSeries(d)&&d.series?d.series:d.title} on Pak Spotlight, a classic Pakistani PTV drama archive.`):'Pak Spotlight is a classic Pakistani PTV drama archive featuring drama serials, classic long plays, telefilms, comedy and short productions with YouTube viewing links.';
  document.title=title;
  const meta=document.querySelector('meta[name="description"]');if(meta)meta.setAttribute('content',desc.slice(0,300));
  const ogTitle=document.querySelector('meta[property="og:title"]');if(ogTitle)ogTitle.setAttribute('content',title);
  const ogDesc=document.querySelector('meta[property="og:description"]');if(ogDesc)ogDesc.setAttribute('content',desc.slice(0,300));
  const twTitle=document.querySelector('meta[name="twitter:title"]');if(twTitle)twTitle.setAttribute('content',title);
  const twDesc=document.querySelector('meta[name="twitter:description"]');if(twDesc)twDesc.setAttribute('content',desc.slice(0,300));
  const image=d&&d.image?d.image:'https://pak-spotlight.pakifun3.workers.dev/logo.png';
  const ogImage=document.querySelector('meta[property="og:image"]');if(ogImage)ogImage.setAttribute('content',image);
  const twImage=document.querySelector('meta[name="twitter:image"]');if(twImage)twImage.setAttribute('content',image);
  const pageUrl=d?base+'?drama='+encodeURIComponent(String(d.id)):base;
  const ogUrl=document.querySelector('meta[property="og:url"]');if(ogUrl)ogUrl.setAttribute('content',pageUrl);
  let canonical=document.querySelector('link[rel="canonical"]');if(!canonical){canonical=document.createElement('link');canonical.rel='canonical';document.head.appendChild(canonical)}
  canonical.href=pageUrl;

function adminForm(d=null){editingId=d?.id||null;editingImage=d?.image||"";$('app').innerHTML=`<section class="admin-shell"><a class="watch" href="#" onclick="goHome();return false">← WEBSITE</a><h1>${d?'Edit '+esc(d.title):'Add Drama'}</h1><form id="form" class="form"><div><label>English Title *</label><input id="title" required value="${esc(d?.title)}"></div><div><label>Urdu Title</label><input id="urdu" value="${esc(d?.urdu)}"></div><div><label>Year</label><input id="year" value="${esc(d?.year)}"></div><div><label>Category</label><select id="type"><option>Serial / Series</option><option>Long Play</option><option>Comedy</option><option>Shorts</option></select></div><div><label>Series Name (for episodes)</label><input id="series" value="${esc(d?.series)}" placeholder="e.g. Nuskha Hazir Hai"></div><div><label>Episode Number</label><input id="episode" type="number" min="1" value="${d?.episode??''}" placeholder="1, 2, 3..."></div><div><label>Writer</label><input id="writer" value="${esc(d?.writer)}"></div><div><label>Director</label><input id="director" value="${esc(d?.director)}"></div><div><label>Produced</label><input id="produced" value="${esc(d?.produced)}"></div><div class="full"><label>Cast</label><input id="cast" value="${esc(d?.cast)}"></div><div class="full"><label>Description</label><textarea id="description">${esc(d?.description)}</textarea></div><div class="full"><label>YouTube Link</label><input id="youtube" type="url" value="${esc(d?.youtube)}" placeholder="https://youtu.be/..."><div class="ai-box"><h3>🤖 Identify & Auto-Fill <span class="ai-badge">PAK SPOTLIGHT</span></h3><div class="ai-row"><input id="ytSearch" placeholder="Search your Pak Spotlight channel"><button type="button" onclick="searchPakSpotlight()">SEARCH CHANNEL</button><button type="button" class="gold" onclick="identifyAndAutofill()">IDENTIFY & AUTO-FILL</button></div><div id="aiStatus" class="ai-status">Paste a YouTube link above, or search your Pak Spotlight channel. Review every field before saving.</div><div id="aiResults" class="ai-results"></div></div></div><div class="full"><label>Thumbnail Image</label><input id="image" type="file" accept="image/*"><div class="meta">When editing, leave this empty to keep the existing thumbnail.</div></div><div class="full actions"><button class="gold" type="submit">SAVE DRAMA</button><button type="button" onclick="showAdmin()">CANCEL</button></div><div class="full msg" id="msg"></div></form></section>`;$('type').value=d?.type||'Serial / Series';$('form').onsubmit=saveForm}
async function saveForm(e){e.preventDefault();if(!authSession){showLogin();return}$('msg').textContent='Saving...';const f=$('image').files[0];if(f&&f.size>3*1024*1024){$('msg').textContent='Thumbnail must be under 3 MB.';return}const payload={title:$('title').value.trim(),urdu_title:$('urdu').value.trim(),year:$('year').value.trim(),type:$('type').value,series_name:$('series').value.trim(),episode_number:$('episode').value?Number($('episode').value):null,writer:$('writer').value.trim(),director:$('director').value.trim(),produced:$('produced').value.trim(),cast:$('cast').value.trim(),description:$('description').value.trim(),youtube_url:$('youtube').value.trim()};let id=editingId;let q;if(editingId){q=await supabase.from('Drama').update(payload).eq('id',editingId);if(q.error){$('msg').textContent='Save failed: '+q.error.message;return}}else{q=await supabase.from('Drama').insert(payload).select('id').single();if(q.error){$('msg').textContent='Save failed: '+q.error.message;return}id=q.data.id}if(f){$('msg').textContent='Uploading thumbnail...';const ext=(f.type||'image/jpeg').split('/')[1]?.replace('jpeg','jpg')||'jpg';const path=`drama/${id}.${ext}`;const up=await supabase.storage.from('thumbnails').upload(path,f,{contentType:f.type||'image/jpeg',upsert:true,cacheControl:'31536000'});if(up.error){$('msg').textContent='Drama saved, but thumbnail upload failed: '+up.error.message;return}const pub=supabase.storage.from('thumbnails').getPublicUrl(path).data.publicUrl;const uq=await supabase.from('Drama').update({thumbnail_url:pub}).eq('id',id);if(uq.error){$('msg').textContent='Thumbnail uploaded, but database update failed: '+uq.error.message;return}}else if(editingId&&editingImage){await supabase.from('Drama').update({thumbnail_url:editingImage}).eq('id',id)}loadPromise=null;await load(true);$('msg').textContent='Saved successfully.';setTimeout(showAdmin,400)}
window.testThumbnailStorage=async function(){
  if(!authSession){showLogin();return}
  const msg=$('migrationMsg'); if(!msg)return;
  msg.textContent='Testing thumbnails Storage bucket...';
  try{
    const testPath=`_migration_test/${Date.now()}.txt`;
    const blob=new Blob(['Pak Spotlight Storage test'],{type:'text/plain'});
    const up=await supabase.storage.from('thumbnails').upload(testPath,blob,{contentType:'text/plain',upsert:false,cacheControl:'3600'});
    if(up.error)throw up.error;
    await supabase.storage.from('thumbnails').remove([testPath]);
    msg.textContent='Storage test successful. The thumbnails bucket is working.';
  }catch(e){
    console.error('Storage test failed',e);
    msg.textContent='Storage test failed: '+(e.message||e);
  }
};
window.migrateThumbnails=async function(){
  if(!authSession){showLogin();return}
  const btn=$('migrateBtn'),msg=$('migrationMsg');
  if(!btn||!msg)return;
  if(!confirm('Migrate all old Base64 thumbnails to Storage? Existing Drama records will not be deleted.'))return;
  btn.disabled=true;
  let done=0,failed=0;
  try{
    msg.textContent='Checking Storage bucket...';
    const testPath=`_migration_test/${Date.now()}.txt`;
    const testUp=await supabase.storage.from('thumbnails').upload(testPath,new Blob(['test'],{type:'text/plain'}),{contentType:'text/plain',upsert:false,cacheControl:'3600'});
    if(testUp.error)throw new Error('Storage bucket check failed: '+testUp.error.message);
    await supabase.storage.from('thumbnails').remove([testPath]);

    const idsQ=await supabase.from('Drama').select('id').like('thumbnail_url','data:%');
    if(idsQ.error)throw idsQ.error;
    const ids=(idsQ.data||[]).map(x=>x.id).filter(Boolean);
    if(!ids.length){msg.textContent='No old Base64 thumbnails found. Nothing to migrate.';return}
    msg.textContent=`Found ${ids.length} old thumbnail${ids.length===1?'':'s'}. Starting...`;

    for(let i=0;i<ids.length;i++){
      const id=ids[i];
      try{
        const q=await supabase.from('Drama').select('id,title,thumbnail_url').eq('id',id).single();
        if(q.error)throw q.error;
        const row=q.data;
        if(!row||!String(row.thumbnail_url||'').startsWith('data:'))continue;
        msg.textContent=`Migrating ${i+1} of ${ids.length}: ${row.title||row.id}...`;
        const m=String(row.thumbnail_url).match(/^data:([^;,]+)?;base64,(.*)$/s);
        if(!m)throw new Error('Invalid Base64 data URL');
        const mime=m[1]||'image/jpeg', b64=m[2].replace(/\s/g,'');
        let binary;
        try{binary=atob(b64)}catch(e){throw new Error('Invalid Base64 image data')}
        const bytes=new Uint8Array(binary.length);
        const chunk=32768;
        for(let j=0;j<binary.length;j+=chunk){
          const end=Math.min(j+chunk,binary.length);
          for(let k=j;k<end;k++)bytes[k]=binary.charCodeAt(k);
        }
        const ext=(mime.split('/')[1]||'jpg').replace('jpeg','jpg').replace(/[^a-z0-9]/gi,'')||'jpg';
        const path=`migrated/${id}.${ext}`;
        const up=await supabase.storage.from('thumbnails').upload(path,new Blob([bytes],{type:mime}),{contentType:mime,upsert:true,cacheControl:'31536000'});
        if(up.error)throw new Error('Storage upload failed: '+up.error.message);
        const pub=supabase.storage.from('thumbnails').getPublicUrl(path).data.publicUrl;
        if(!pub)throw new Error('Could not create public Storage URL');
        const uq=await supabase.from('Drama').update({thumbnail_url:pub}).eq('id',id);
        if(uq.error)throw new Error('Database update failed: '+uq.error.message);
        done++;
        msg.textContent=`Migrated ${done} of ${ids.length}: ${row.title||row.id}`;
      }catch(e){
        failed++;
        console.error('Thumbnail migration failed',id,e);
        msg.textContent=`Skipped ${i+1}/${ids.length} (${id}): ${e.message||e}`;
        await new Promise(r=>setTimeout(r,250));
      }
    }
    loadPromise=null; await load(true);
    msg.textContent=`Migration finished. ${done} migrated${failed?`, ${failed} skipped`:''}.`;
  }catch(e){
    console.error(e);
    msg.textContent='Migration stopped: '+(e.message||e);
  }finally{btn.disabled=false}
};

function setAIStatus(text,ok=false){const el=$('aiStatus');if(el){el.textContent=text;el.style.color=ok?'#8ee6a5':'#aaa'}}\nfunction fillField(id,value){const el=$(id);if(el&&value!==undefined&&value!==null&&String(value).trim()!=='')el.value=String(value).trim()}\nfunction applyAutofill(data){
  fillField('title',data.title); fillField('urdu',data.urdu); fillField('year',data.year); fillField('series',data.series); fillField('episode',data.episode);
  fillField('writer',data.writer); fillField('director',data.director); fillField('produced',data.produced); fillField('cast',data.cast); fillField('description',data.description); fillField('youtube',data.youtube);
  if(data.type&&$('type')){const opts=[...$('type').options].map(o=>o.value); if(opts.includes(data.type))$('type').value=data.type}
}\nwindow.searchPakSpotlight=async function(){\n  const q=$('ytSearch')?.value.trim(); if(!q){setAIStatus('Enter a drama/video name to search your Pak Spotlight channel.');return}\n  setAIStatus('Searching Pak Spotlight YouTube channel…'); $('aiResults').innerHTML='';\n  try{const r=await fetch('/api/youtube-search?q='+encodeURIComponent(q));const j=await r.json();if(!r.ok)throw new Error(j.error||'Search failed');\n    const items=j.items||[]; if(!items.length){setAIStatus('No matching videos found on Pak Spotlight.');return}\n    $('aiResults').innerHTML=items.map((v,i)=>`<div class="ai-result" onclick="selectYouTubeResult(${i})"><b>${esc(v.title)}</b><small>${esc(v.publishedAt||'')} · ${esc(v.description||'').slice(0,180)}</small></div>`).join('');\n    window.__ytResults=items; setAIStatus(`${items.length} matching video${items.length===1?'':'s'} found. Tap one to select it.`);\n  }catch(e){console.error(e);setAIStatus('YouTube search failed: '+(e.message||e))}
};\nwindow.selectYouTubeResult=function(i){const v=window.__ytResults?.[i];if(!v)return;fillField('youtube',v.url);setAIStatus('Selected: '+v.title+' — now identifying metadata…');identifyAndAutofill()}\nwindow.identifyAndAutofill=async function(){\n  const url=$('youtube')?.value.trim(); if(!url){setAIStatus('Paste a YouTube link first, or search the Pak Spotlight channel.');return}\n  setAIStatus('Identifying video and preparing fields…');\n  try{const r=await fetch('/api/identify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Identification failed');\n    applyAutofill(j.data||{});\n    const note=j.aiUsed?'AI-assisted draft ready.':'YouTube metadata draft ready. AI key is not connected yet, so no unsupported facts were invented.';\n    setAIStatus(note+' Review all fields before saving.',true);\n  }catch(e){console.error(e);setAIStatus('Auto-fill failed: '+(e.message||e))}
};\nfunction renderAdmin(){const list=$('adminList'),gs=groups(rows);list.innerHTML=gs.length?gs.map(g=>`<div class="drama-row"><div><b>${esc(isSeries(g[0])&&g[0].series?g[0].series:g[0].title)}</b><div class="meta">${esc(g[0].type)} · ${g.length} item${g.length===1?'':'s'}</div>${g.length>1?`<div class="admin-episodes">${g.map(e=>'Episode '+(e.episode??'?')+' — '+esc(e.title)).join('<br>')}</div>`:''}</div><div class="actions">${g.map(e=>`<button onclick="adminEdit('${encodeURIComponent(String(e.id))}')">EDIT${e.episode?' E'+e.episode:''}</button><button class="danger" onclick="adminDelete('${encodeURIComponent(String(e.id))}')">DELETE${e.episode?' E'+e.episode:''}</button>`).join('')}</div></div>`).join(''):'<div class="empty">No dramas yet.</div>'}
