<style>
body{background:#0b0d10;color:#f5f5f3}
.admin-page{max-width:1100px;margin:0 auto;padding:30px 6%}
.admin-header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0 28px;border-bottom:1px solid #292e36;margin-bottom:25px}

.admin-card{background:#13161b;border:1px solid #292e36;border-radius:14px;padding:24px;margin-bottom:20px}

.admin-btn.gold{background:#ffd34e;color:#15120a;border-color:#ffd34e}.admin-btn.danger{color:#ff8585;border-color:#633838}

<header class="topbar">
  <a class="brand" href="/" aria-label="Pak Spotlight"><img class="logo" src="/logo.png" alt="Pak Spotlight" width="48" height="48"><div><b>PAK SPOTLIGHT</b><small>ADMINISTRATION</small></div></a>
  <a class="admin-btn" href="/">WEBSITE</a>
</header>
<main id="adminApp" class="admin-page"></main>
<footer><div><b>PAK SPOTLIGHT</b><br>Classic PTV Drama Archive</div><div>Admin panel</div><div>© 2026 Pak Spotlight</div></footer>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://whcseoasnaswlhnzduix.supabase.co","sb_publishable_fkK2ryuBKr0WK96m34Cczg_7ofQBaOk");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[],authSession=null,editingId=null,editingImage="";
function map(r){return {id:r.id,title:r.title??r.Title??"",urdu:r.urdu_title??r.urdu??r.Urdu??"",year:r.year??"",type:r.type??"",writer:r.writer??"",produced:r.produced??"",director:r.director??"",cast:r.cast??"",description:r.description??"",youtube:r.youtube_url??r.youtube??"",image:r.thumbnail_url??r.image??r.thumbnail??"",series:r.series_name??"",episode:r.episode_number==null?null:Number(r.episode_number)}}
function normalize(s){return String(s??"").replace(/\s+/g," ").trim().toLowerCase()}
function isSeries(d){return ["Serial / Series","Series","Serial","Comedy"].includes(String(d.type||""))}
function groups(list){const m=new Map();for(const d of list){const series=isSeries(d)&&String(d.series||"").trim();const key=series?"series:"+String(d.type).trim().toLowerCase()+":"+normalize(series):"id:"+d.id;if(!m.has(key))m.set(key,[]);m.get(key).push(d)}return [...m.values()].map(g=>g.sort((a,b)=>(a.episode??999999)-(b.episode??999999)))}
async function load(){let q=await supabase.from("Drama").select("id,title,urdu_title,year,type,writer,director,cast,description,youtube_url,series_name,episode_number,thumbnail_url");if(q.error)q=await supabase.from("Drama").select("*");if(q.error)throw q.error;rows=(q.data||[]).map(map);return rows}
function showLogin(message=""){ $("adminApp").innerHTML=`<div class="auth-box"><h1>Admin Login</h1><p class="meta">Sign in with your Supabase admin account to manage Pak Spotlight.</p><form id="loginForm"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required placeholder="admin@example.com"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Password"><div class="admin-actions"><button class="admin-btn gold" type="submit">SIGN IN</button><a class="admin-btn" href="/">CANCEL</a></div><div id="loginMsg" class="admin-msg admin-error">${esc(message)}</div></form></div>`; $("loginForm").onsubmit=async e=>{e.preventDefault();const msg=$("loginMsg");msg.className="admin-msg";msg.textContent="Signing in…";const q=await supabase.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPassword").value});if(q.error){msg.className="admin-msg admin-error";msg.textContent="Login failed: "+q.error.message;return}authSession=q.data.session;await showDashboard()}}
async function showDashboard(){if(!authSession){showLogin();return}try{await load()}catch(e){$("adminApp").innerHTML=`<div class="admin-card"><h1>Database connection failed</h1><p class="admin-msg admin-error">${esc(e.message||e)}</p><button class="admin-btn" onclick="location.reload()">RETRY</button></div>`;return}$("adminApp").innerHTML=`<div class="admin-header"><div><div class="tag">PRIVATE ADMIN</div><h1>Drama Admin</h1><div class="meta">Signed in as ${esc(authSession.user.email||"Admin")}</div></div><button id="logoutBtn" class="admin-btn">LOG OUT</button></div><div class="admin-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2>Drama Dashboard</h2><p class="meta">${rows.length} drama record${rows.length===1?'':'s'} in Supabase.</p></div><button id="addBtn" class="admin-btn gold">+ ADD DRAMA</button></div></div><div class="admin-card"><h2>Your Dramas</h2><div id="adminList"></div></div><div class="admin-card"><h2>Thumbnails Storage</h2><p class="meta">Test the <b>thumbnails</b> bucket without changing existing drama data.</p><button id="testStorage" class="admin-btn">TEST STORAGE</button><div id="storageMsg" class="admin-msg"></div></div>`;$("logoutBtn").onclick=async()=>{await supabase.auth.signOut();authSession=null;showLogin()};$("addBtn").onclick=()=>showForm();$("testStorage").onclick=testStorage;renderAdmin()}
function renderAdmin(){const list=$("adminList"),gs=groups(rows);list.innerHTML=gs.length?gs.map(g=>`<div class="drama-row"><div><div class="row-title">${esc(isSeries(g[0])&&g[0].series?g[0].series:g[0].title)}</div><div class="row-meta">${esc(g[0].type)} · ${g.length} item${g.length===1?'':'s'}</div>${g.length>1?`<div class="row-meta">${g.map(e=>`Episode ${e.episode??'?'} — ${esc(e.title)}`).join('<br>')}</div>`:''}</div><div class="admin-actions">${g.map(e=>`<button class="admin-btn" data-edit="${encodeURIComponent(String(e.id))}">EDIT${e.episode?' E'+e.episode:''}</button><button class="admin-btn danger" data-delete="${encodeURIComponent(String(e.id))}">DELETE${e.episode?' E'+e.episode:''}</button>`).join('')}</div></div>`).join(''):'<div class="empty">No dramas yet.</div>';list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const d=rows.find(x=>String(x.id)===decodeURIComponent(b.dataset.edit));if(d)showForm(d)});list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteDrama(decodeURIComponent(b.dataset.delete)))}
function showForm(d=null){editingId=d?.id||null;editingImage=d?.image||"";$("adminApp").innerHTML=`<div class="admin-header"><div><div class="tag">${d?'EDIT DRAMA':'ADD DRAMA'}</div><h1>${d?'Edit '+esc(d.title):'Add New Drama'}</h1></div><button id="backBtn" class="admin-btn">← DASHBOARD</button></div><div class="admin-card"><form id="dramaForm" class="admin-form"><div><label>English Title *</label><input id="title" required value="${esc(d?.title)}"></div><div><label>Urdu Title</label><input id="urdu" value="${esc(d?.urdu)}"></div><div><label>Year</label><input id="year" value="${esc(d?.year)}"></div><div><label>Category</label><select id="type"><option>Serial / Series</option><option>Long Play</option><option>Comedy</option><option>Shorts</option></select></div><div><label>Series Name (for episodes)</label><input id="series" value="${esc(d?.series)}" placeholder="e.g. Nuskha Hazir Hai"></div><div><label>Episode Number</label><input id="episode" type="number" min="1" value="${d?.episode??''}"></div><div><label>Writer</label><input id="writer" value="${esc(d?.writer)}"></div><div><label>Director</label><input id="director" value="${esc(d?.director)}"></div><div><label>Produced</label><input id="produced" value="${esc(d?.produced)}"></div><div class="full"><label>Cast</label><input id="cast" value="${esc(d?.cast)}"></div><div class="full"><label>Description</label><textarea id="description">${esc(d?.description)}</textarea></div><div class="full"><label>YouTube Link</label><input id="youtube" type="url" value="${esc(d?.youtube)}" placeholder="https://youtu.be/..."></div><div class="full"><label>Thumbnail Image</label><input id="image" type="file" accept="image/*"><div class="meta" style="margin-top:6px">Leave empty when editing to keep the current thumbnail.</div></div><div class="full admin-actions"><button class="admin-btn gold" type="submit">SAVE DRAMA</button><button id="cancelBtn" class="admin-btn" type="button">CANCEL</button></div><div class="full admin-msg" id="formMsg"></div></form></div>`;$("type").value=d?.type||'Serial / Series';$("backBtn").onclick=showDashboard;$("cancelBtn").onclick=showDashboard;$("dramaForm").onsubmit=saveForm}
async function saveForm(e){e.preventDefault();if(!authSession){showLogin();return}const msg=$("formMsg"),f=$("image").files[0];msg.className="full admin-msg";msg.textContent="Saving…";if(f&&f.size>3*1024*1024){msg.className="full admin-msg admin-error";msg.textContent="Thumbnail must be under 3 MB.";return}const payload={title:$("title").value.trim(),urdu_title:$("urdu").value.trim(),year:$("year").value.trim(),type:$("type").value,series_name:$("series").value.trim(),episode_number:$("episode").value?Number($("episode").value):null,writer:$("writer").value.trim(),director:$("director").value.trim(),produced:$("produced").value.trim(),cast:$("cast").value.trim(),description:$("description").value.trim(),youtube_url:$("youtube").value.trim()};let id=editingId;let q=editingId?await supabase.from('Drama').update(payload).eq('id',editingId):await supabase.from('Drama').insert(payload).select('id').single();if(q.error){msg.className="full admin-msg admin-error";msg.textContent="Save failed: "+q.error.message;return}if(!editingId)id=q.data.id;if(f){msg.textContent="Uploading thumbnail…";const ext=(f.type||'image/jpeg').split('/')[1]?.replace('jpeg','jpg')||'jpg';const path=`drama/${id}.${ext}`;const up=await supabase.storage.from('thumbnails').upload(path,f,{contentType:f.type||'image/jpeg',upsert:true,cacheControl:'31536000'});if(up.error){msg.className="full admin-msg admin-error";msg.textContent="Drama saved, but thumbnail upload failed: "+up.error.message;return}const pub=supabase.storage.from('thumbnails').getPublicUrl(path).data.publicUrl;const uq=await supabase.from('Drama').update({thumbnail_url:pub}).eq('id',id);if(uq.error){msg.className="full admin-msg admin-error";msg.textContent="Thumbnail uploaded, but database update failed: "+uq.error.message;return}}else if(editingId&&editingImage){await supabase.from('Drama').update({thumbnail_url:editingImage}).eq('id',id)}msg.className="full admin-msg admin-success";msg.textContent="Saved successfully.";setTimeout(showDashboard,700)}
async function deleteDrama(id){const d=rows.find(x=>String(x.id)===String(id));if(!d||!confirm('Delete '+d.title+'?'))return;const q=await supabase.from('Drama').delete().eq('id',id);if(q.error){alert('Delete failed: '+q.error.message);return}await showDashboard()}
async function testStorage(){const msg=$("storageMsg");msg.textContent="Testing thumbnails bucket…";try{const path=`_admin_test/${Date.now()}.txt`;const up=await supabase.storage.from('thumbnails').upload(path,new Blob(['Pak Spotlight Storage test'],{type:'text/plain'}),{contentType:'text/plain',upsert:false,cacheControl:'3600'});if(up.error)throw up.error;await supabase.storage.from('thumbnails').remove([path]);msg.className="admin-msg admin-success";msg.textContent="Storage test successful. The thumbnails bucket is working."}catch(e){msg.className="admin-msg admin-error";msg.textContent="Storage test failed: "+(e.message||e)}}
supabase.auth.getSession().then(async({data})=>{authSession=data.session||null;if(authSession)await showDashboard();else showLogin()}).catch(e=>showLogin(e.message||"Could not initialize Supabase."));
supabase.auth.onAuthStateChange((_event,session)=>{authSession=session||null});
</script>
</body></html>
