<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pak Spotlight — Admin</title>
<style>
:root{--bg:#0b0d10;--panel:#14171c;--line:#292e36;--text:#f5f5f3;--muted:#a8afb9;--gold:#ffd34e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}

.topbar{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand admin" "nav nav";row-gap:8px;padding:9px 5%;align-items:center;background:rgba(9,11,14,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.topbar .brand{grid-area:brand;display:flex;align-items:center;gap:10px;min-width:0}.topbar .logo{width:48px;height:48px;object-fit:contain}.topbar .brand b{font-size:16px;letter-spacing:2px}.topbar .brand small{display:block;color:#9aa1aa;font-size:8px;letter-spacing:1.1px;margin-top:3px}
.topbar .admin-switch{grid-area:admin;justify-self:end;display:block;border:1px solid #555;background:#171a1f;color:#fff;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer;text-decoration:none}
.topbar .public-nav{grid-area:nav;width:100%;display:flex;justify-content:center;align-items:center;gap:24px;overflow-x:auto;white-space:nowrap;padding:3px 0 2px;scrollbar-width:none}.topbar .public-nav::-webkit-scrollbar{display:none}.topbar .public-nav a{flex:0 0 auto;font-weight:700;font-size:12px;color:#ddd}.topbar .public-nav a:hover{color:var(--gold)}

main{min-height:80vh}

section{padding:42px max(16px,6%)}
.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}h2{font-size:30px;margin:6px 0}
.tag{color:var(--gold);letter-spacing:2px;font-size:10px;font-weight:bold}

.empty{padding:25px;border:1px dashed #464c55;border-radius:10px;color:#aaa}

footer{border-top:1px solid var(--line);padding:26px 6%;color:#7f8792;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px}

/* Admin Page */
.admin-page{max-width:1100px;margin:0 auto;padding:30px 6%}
.admin-header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0 28px;border-bottom:1px solid var(--line);margin-bottom:25px}
.admin-brand{display:flex;align-items:center;gap:12px}.admin-brand img{width:52px;height:52px;object-fit:contain}.admin-brand b{display:block;letter-spacing:2px}.admin-brand small{color:#999;letter-spacing:1.4px}
.admin-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}
.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:15px}.admin-form .full{grid-column:1/-1}
.admin-form label{display:block;color:#aaa;font-size:12px;font-weight:bold;margin-bottom:7px}
.admin-form input,.admin-form textarea,.admin-form select{width:100%;background:#0d1014;border:1px solid #363c45;color:#fff;border-radius:8px;padding:12px;box-sizing:border-box}
.admin-form textarea{min-height:120px;resize:vertical}
.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.admin-btn{border:1px solid #383d45;background:#171a1f;color:#eee;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:bold;text-decoration:none}
.admin-btn.gold{background:var(--gold);color:#15120a;border-color:var(--gold)}.admin-btn.danger{color:#ff8585;border-color:#633838}
.admin-msg{margin-top:12px;min-height:20px;color:#9aa3ad}.admin-success{color:#8ee6a5}.admin-error{color:#ff8585}

/* Auth Box */
.auth-box{max-width:520px;margin:50px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.auth-box h1{margin-top:0}.auth-box label{display:block;color:#aaa;font-size:12px;font-weight:bold;margin:14px 0 7px}
.auth-box input{width:100%;box-sizing:border-box;background:#0d1014;border:1px solid #363c45;color:#fff;border-radius:8px;padding:13px}

/* Drama List */
.drama-row{display:flex;justify-content:space-between;align-items:center;gap:15px;border:1px solid var(--line);background:#0d1014;padding:15px;border-radius:10px;margin-top:10px}
.row-title{font-weight:bold}.row-meta{font-size:12px;color:#8f98a3;margin-top:5px}

/* AI Auto-Fill */
.ai-box{background:linear-gradient(135deg,#15191f,#101216);border:1px solid #3a3f48;border-radius:12px;padding:16px;margin-bottom:18px}.ai-box h3{margin:0 0 6px;color:var(--gold)}.ai-box p{margin:0 0 12px;color:#aeb5bf;font-size:13px;line-height:1.5}.ai-row{display:flex;gap:10px;flex-wrap:wrap}.ai-row input{flex:1;min-width:240px}.ai-status{margin-top:10px;font-size:13px}.ai-status.ok{color:#8ee6a5}.ai-status.err{color:#ff8888}

@media(max-width:850px){.topbar{flex-wrap:wrap}.topbar .brand{margin-right:0}.topbar .public-nav{order:3;width:100%;justify-content:space-between;gap:8px;padding:3px 0}.topbar .public-nav a{font-size:11px}}
@media(max-width:700px){.admin-form{grid-template-columns:1fr}.admin-form .full{grid-column:auto}.drama-row{align-items:flex-start;flex-direction:column}.admin-header{align-items:flex-start}.topbar{padding:8px 22px;row-gap:7px}.topbar .public-nav{justify-content:flex-start;gap:20px;font-size:13px}.topbar .logo{width:48px;height:48px}.topbar .brand b{font-size:15px}.topbar .brand small{font-size:8px}.admin-switch{padding:10px 14px!important}}
@media(max-width:520px){.topbar{padding:8px 12px}.topbar .logo{width:42px;height:42px}.topbar .brand b{font-size:13px}.topbar .brand small{font-size:7px}.topbar .public-nav{overflow-x:auto;justify-content:flex-start;gap:20px}.topbar .public-nav a{white-space:nowrap}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="Pak Spotlight"><img class="logo" src="/logo.png" alt="Pak Spotlight" width="48" height="48"><div><b>PAK SPOTLIGHT</b><small>ADMINISTRATION</small></div></a>
  <a class="admin-btn" href="/">WEBSITE</a>
</header>
<main id="adminApp" class="admin-page"></main>
<footer><div><b>PAK SPOTLIGHT</b><br>Classic PTV Drama Archive</div><div>Admin panel</div><div>© 2026 Pak Spotlight</div></footer>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase = createClient("https://whcseoasnaswlhnzduix.supabase.co", "sb_publishable_fkK2ryuBKr0WK96m34Cczg_7ofQBaOk");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows = [], authSession = null, editingId = null, editingImage = "";

function map(r) {
  return {
    id: r.id, title: r.title ?? r.Title ?? "", urdu: r.urdu_title ?? r.urdu ?? r.Urdu ?? "",
    year: r.year ?? "", type: r.type ?? "", writer: r.writer ?? "", produced: r.produced ?? "",
    director: r.director ?? "", cast: r.cast ?? "", description: r.description ?? "",
    youtube: r.youtube_url ?? r.youtube ?? "", image: r.thumbnail_url ?? r.image ?? r.thumbnail ?? "",
    series: r.series_name ?? "", episode: r.episode_number == null ? null : Number(r.episode_number)
  };
}

function normalize(s) { return String(s ?? "").replace(/\s+/g, " ").trim().toLowerCase(); }
function isSeries(d) { return ["Serial / Series", "Series", "Serial", "Comedy"].includes(String(d.type || "")); }

function groups(list) {
  const m = new Map();
  for (const d of list) {
    const series = isSeries(d) && String(d.series || "").trim();
    const key = series ? "series:" + String(d.type).trim().toLowerCase() + ":" + normalize(series) : "id:" + d.id;
    if (!m.has(key)) m.set(key, []);
    m.get(key).push(d);
  }
  return [...m.values()].map(g => g.sort((a, b) => (a.episode ?? 999999) - (b.episode ?? 999999)));
}

async function load() {
  let q = await supabase.from("Drama").select("id,title,urdu_title,year,type,writer,director,cast,description,youtube_url,series_name,episode_number,thumbnail_url");
  if (q.error) q = await supabase.from("Drama").select("*");
  if (q.error) throw q.error;
  rows = (q.data || []).map(map);
  return rows;
}

function showLogin(message = "") {
  $("adminApp").innerHTML = `<div class="auth-box"><h1>Admin Login</h1><p class="admin-msg">Sign in with your Supabase admin account to manage Pak Spotlight.</p><form id="loginForm"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required placeholder="admin@example.com"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Password"><div class="admin-actions"><button class="admin-btn gold" type="submit">SIGN IN</button><a class="admin-btn" href="/">CANCEL</a></div><div id="loginMsg" class="admin-msg admin-error">${esc(message)}</div></form></div>`;
  $("loginForm").onsubmit = async e => {
    e.preventDefault();
    const msg = $("loginMsg");
    msg.className = "admin-msg";
    msg.textContent = "Signing in…";
    const q = await supabase.auth.signInWithPassword({ email: $("loginEmail").value.trim(), password: $("loginPassword").value });
    if (q.error) { msg.className = "admin-msg admin-error"; msg.textContent = "Login failed: " + q.error.message; return; }
    authSession = q.data.session;
    await showDashboard();
  };
}

async function showDashboard() {
  if (!authSession) { showLogin(); return; }
  try { await load(); } catch (e) {
    $("adminApp").innerHTML = `<div class="admin-card"><h1>Database connection failed</h1><p class="admin-msg admin-error">${esc(e.message || e)}</p><button class="admin-btn" onclick="location.reload()">RETRY</button></div>`;
    return;
  }
  $("adminApp").innerHTML = `
    <div class="admin-header"><div><div class="tag">PRIVATE ADMIN</div><h1>Drama Admin</h1><div class="admin-msg">Signed in as ${esc(authSession.user.email || "Admin")}</div></div><button id="logoutBtn" class="admin-btn">LOG OUT</button></div>
    <div class="admin-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2>Drama Dashboard</h2><p class="admin-msg">${rows.length} drama record${rows.length === 1 ? '' : 's'} in Supabase.</p></div><button id="addBtn" class="admin-btn gold">+ ADD DRAMA</button></div></div>
    <div class="admin-card"><h2>Your Dramas</h2><div id="adminList"></div></div>
    <div class="admin-card"><h2>Thumbnails Storage</h2><p class="admin-msg">Test the <b>thumbnails</b> bucket without changing existing drama data.</p><button id="testStorage" class="admin-btn">TEST STORAGE</button><div id="storageMsg" class="admin-msg"></div></div>`;
  $("logoutBtn").onclick = async () => { await supabase.auth.signOut(); authSession = null; showLogin(); };
  $("addBtn").onclick = () => showForm();
  $("testStorage").onclick = testStorage;
  renderAdmin();
}

function renderAdmin() {
  const list = $("adminList"), gs = groups(rows);
  list.innerHTML = gs.length ? gs.map(g => `<div class="drama-row"><div><div class="row-title">${esc(isSeries(g[0]) && g[0].series ? g[0].series : g[0].title)}</div><div class="row-meta">${esc(g[0].type)} · ${g.length} item${g.length === 1 ? '' : 's'}</div>${g.length > 1 ? `<div class="row-meta">${g.map(e => `Episode ${e.episode ?? '?'} — ${esc(e.title)}`).join('<br>')}</div>` : ''}</div><div class="admin-actions">${g.map(e => `<button class="admin-btn" data-edit="${encodeURIComponent(String(e.id))}">EDIT${e.episode ? ' E' + e.episode : ''}</button><button class="admin-btn danger" data-delete="${encodeURIComponent(String(e.id))}">DELETE${e.episode ? ' E' + e.episode : ''}</button>`).join('')}</div></div>`).join('') : '<div class="empty">No dramas yet.</div>';
  list.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const d = rows.find(x => String(x.id) === decodeURIComponent(b.dataset.edit));
    if (d) showForm(d);
  });
  list.querySelectorAll('[data-delete]').forEach(b => b.onclick = () => deleteDrama(decodeURIComponent(b.dataset.delete)));
}

function showForm(d = null) {
  editingId = d?.id || null; editingImage = d?.image || "";
  $("adminApp").innerHTML = `
    <div class="admin-header"><div><div class="tag">${d ? 'EDIT DRAMA' : 'ADD DRAMA'}</div><h1>${d ? 'Edit ' + esc(d.title) : 'Add New Drama'}</h1></div><button id="backBtn" class="admin-btn">← DASHBOARD</button></div>
    <div class="admin-card"><div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button id="aiTopBtn" class="admin-btn gold" type="button">✦ AI AUTO-FILL FROM YOUTUBE</button></div>
    <form id="dramaForm" class="admin-form">
      <div><label>English Title *</label><input id="title" required value="${esc(d?.title)}"></div>
      <div><label>Urdu Title</label><input id="urdu" value="${esc(d?.urdu)}"></div>
      <div><label>Year</label><input id="year" value="${esc(d?.year)}"></div>
      <div><label>Category</label><select id="type"><option>Serial / Series</option><option>Long Play</option><option>Comedy</option><option>Shorts</option></select></div>
      <div><label>Series Name (for episodes)</label><input id="series" value="${esc(d?.series)}" placeholder="e.g. Nuskha Hazir Hai"></div>
      <div><label>Episode Number</label><input id="episode" type="number" min="1" value="${d?.episode ?? ''}"></div>
      <div><label>Writer</label><input id="writer" value="${esc(d?.writer)}"></div>
      <div><label>Director</label><input id="director" value="${esc(d?.director)}"></div>
      <div><label>Produced</label><input id="produced" value="${esc(d?.produced)}"></div>
      <div class="full"><label>Cast</label><input id="cast" value="${esc(d?.cast)}"></div>
      <div class="full"><label>Description</label><textarea id="description">${esc(d?.description)}</textarea></div>
      <div class="full"><label>SEO Title</label><input id="seo_title" value="${esc(d?.seo_title)}" placeholder="Auto-generated by AI"></div>
      <div class="full"><label>SEO Description (150-160 chars)</label><textarea id="seo_description" style="min-height:60px">${esc(d?.seo_description)}</textarea></div>
      <div class="full"><label>YouTube Link</label><input id="youtube" type="url" value="${esc(d?.youtube)}" placeholder="https://youtu.be/..."></div>
      <div class="full"><label>Thumbnail Image</label><input id="image" type="file" accept="image/*"><img id="thumbPreview" style="display:none;max-width:200px;border-radius:8px;margin-top:8px;border:1px solid var(--line)"><div class="admin-msg">Leave empty to keep existing thumbnail when editing.</div></div>
      <div class="full"><label>YouTube Link + AI</label><div class="ai-box"><h3>✦ AI AUTO-FILL (Web Search + SEO)</h3><p>Paste a Pak Spotlight YouTube link. AI will search the web for additional info (writer, cast, year) and generate SEO-optimized title & description.</p><div class="ai-row"><input id="aiYoutube" type="url" value="${esc(d?.youtube)}" placeholder="https://youtu.be/..."><button id="aiFillBtn" class="admin-btn gold" type="button">AUTO-FILL DRAMA</button></div><div id="aiStatus" class="ai-status"></div></div></div>
      <div class="full admin-actions"><button class="admin-btn gold" type="submit">SAVE DRAMA</button><button class="admin-btn" type="button" id="cancelBtn">CANCEL</button></div>
      <div id="formMsg" class="full admin-msg"></div>
    </form></div>`;
  if ($("type")) $("type").value = d?.type || 'Serial / Series';
  $("dramaForm").onsubmit = saveForm;
  $("backBtn").onclick = showDashboard;
  $("cancelBtn").onclick = showDashboard;
  $("aiTopBtn").onclick = () => { $("aiYoutube")?.focus(); };
  $("aiFillBtn").onclick = aiAutoFill;
}

async function aiAutoFill() {
  const btn = $("aiFillBtn"), status = $("aiStatus"), url = $("aiYoutube").value.trim();
  if (!url) { status.className = "ai-status err"; status.textContent = "Paste a YouTube video link first."; return; }
  if (!authSession?.access_token) { showLogin(); return; }
  btn.disabled = true; btn.textContent = "AI WORKING…";
  status.className = "ai-status"; status.textContent = "Searching the web and preparing fields…";
  try {
    const r = await fetch("/api/ai-autofill", {
      method: "POST",
      headers: { "content-type": "application/json", "authorization": "Bearer " + authSession.access_token },
      body: JSON.stringify({ url })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "AI Auto-Fill failed.");
    const f = data.fields || {}, set = (id, v) => { if ($(id) && v !== undefined && v !== null) $(id).value = String(v); };
    set("title", f.title); set("urdu", f.urdu_title); set("year", f.year);
    set("series", f.series_name); set("episode", f.episode_number);
    set("writer", f.writer); set("director", f.director); set("produced", f.produced);
    set("cast", f.cast); set("description", f.description);
    set("seo_title", f.seo_title); set("seo_description", f.seo_description);
    set("youtube", url); set("aiYoutube", url);
    if ($("type")) { const allowed = ["Serial / Series", "Long Play", "Comedy", "Shorts"]; $("type").value = allowed.includes(f.type) ? f.type : "Long Play"; }
    const preview = $("thumbPreview");
    if (preview && f.thumbnail) { preview.src = f.thumbnail; preview.style.display = "block"; }
    status.className = "ai-status ok"; status.textContent = "AI filled the form (web search + SEO). Please review before saving.";
  } catch (e) {
    status.className = "ai-status err"; status.textContent = e.message || String(e);
  } finally { btn.disabled = false; btn.textContent = "AUTO-FILL DRAMA"; }
}

async function saveForm(e) {
  e.preventDefault();
  if (!authSession) { showLogin(); return; }
  const msg = $("formMsg"), f = $("image").files[0];
  msg.className = "full admin-msg"; msg.textContent = "Saving…";
  if (f && f.size > 3 * 1024 * 1024) { msg.className = "full admin-msg admin-error"; msg.textContent = "Thumbnail must be under 3 MB."; return; }
  const payload = {
    title: $("title").value.trim(), urdu_title: $("urdu").value.trim(), year: $("year").value.trim(),
    type: $("type").value, series_name: $("series").value.trim(),
    episode_number: $("episode").value ? Number($("episode").value) : null,
    writer: $("writer").value.trim(), director: $("director").value.trim(),
    produced: $("produced").value.trim(), cast: $("cast").value.trim(),
    description: $("description").value.trim(), youtube_url: $("youtube").value.trim()
  };
  let id = editingId;
  let q = editingId ? await supabase.from('Drama').update(payload).eq('id', editingId) : await supabase.from('Drama').insert(payload).select('id').single();
  if (q.error) { msg.className = "full admin-msg admin-error"; msg.textContent = "Save failed: " + q.error.message; return; }
  if (!editingId) id = q.data.id;
  if (f) {
    msg.textContent = "Uploading thumbnail…";
    const ext = (f.type || 'image/jpeg').split('/')[1]?.replace('jpeg', 'jpg') || 'jpg';
    const path = `drama/${id}.${ext}`;
    const up = await supabase.storage.from('thumbnails').upload(path, f, { contentType: f.type || 'image/jpeg', upsert: true, cacheControl: '31536000' });
    if (up.error) { msg.className = "full admin-msg admin-error"; msg.textContent = "Drama saved, but thumbnail upload failed: " + up.error.message; return; }
    const pub = supabase.storage.from('thumbnails').getPublicUrl(path).data.publicUrl;
    const uq = await supabase.from('Drama').update({ thumbnail_url: pub }).eq('id', id);
    if (uq.error) { msg.className = "full admin-msg admin-error"; msg.textContent = "Thumbnail uploaded, but database update failed: " + uq.error.message; return; }
  } else if (editingId && editingImage) {
    await supabase.from('Drama').update({ thumbnail_url: editingImage }).eq('id', id);
  }
  msg.className = "full admin-msg admin-success"; msg.textContent = "Saved successfully.";
  setTimeout(showDashboard, 400);
}

async function deleteDrama(id) {
  const d = rows.find(x => String(x.id) === String(id));
  if (!d || !confirm('Delete ' + d.title + '?')) return;
  const q = await supabase.from('Drama').delete().eq('id', id);
  if (q.error) { alert('Delete failed: ' + q.error.message); return; }
  await showDashboard();
}

async function testStorage() {
  const msg = $("storageMsg");
  msg.textContent = "Testing thumbnails bucket…";
  try {
    const path = `_admin_test/${Date.now()}.txt`;
    const up = await supabase.storage.from('thumbnails').upload(path, new Blob(['Pak Spotlight Storage test'], { type: 'text/plain' }), { contentType: 'text/plain', upsert: false, cacheControl: '3600' });
    if (up.error) throw up.error;
    await supabase.storage.from('thumbnails').remove([path]);
    msg.className = "admin-msg admin-success"; msg.textContent = "Storage test successful. The thumbnails bucket is working.";
  } catch (e) {
    msg.className = "admin-msg admin-error"; msg.textContent = "Storage test failed: " + (e.message || e);
  }
}

supabase.auth.getSession().then(async ({ data }) => {
  authSession = data.session || null;
  if (authSession) await showDashboard(); else showLogin();
}).catch(e => showLogin(e.message || "Could not initialize Supabase."));
supabase.auth.onAuthStateChange((_event, session) => { authSession = session || null; });
</script>
</body></html>
