<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pak Spotlight — Admin Studio Console</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Noto+Nastaliq+Urdu:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --canvas-void: #060a08;
  --surface-studio: #0d1510;
  --surface-card: #132018;
  --surface-card-hover: #18281e;
  --surface-elevated: #1a2c21;
  --border-subtle: #1e3025;
  --border-gold: rgba(229, 179, 56, 0.35);
  --gold-ptv: #e5b338;
  --gold-hover: #f3c64c;
  --gold-glow: rgba(229, 179, 56, 0.15);
  --phosphor-mint: #2e8b57;
  --phosphor-bg: rgba(46, 139, 87, 0.12);
  --danger-crimson: #ef5350;
  --danger-bg: rgba(239, 83, 80, 0.12);
  --ink-cream: #f4f6f1;
  --ink-subtle: #899c90;
  --ink-dim: #5c6e63;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --control-h: 44px;
  --font-serif: 'Cinzel', serif;
  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --font-urdu: 'Noto Nastaliq Urdu', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background-color: var(--canvas-void);
  color: var(--ink-cream);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-image:
    radial-gradient(circle at 88% 12%, rgba(46, 139, 87, 0.14) 0%, transparent 40%),
    radial-gradient(circle at 12% 78%, rgba(229, 179, 56, 0.07) 0%, transparent 35%);
  background-attachment: fixed;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; outline: none; transition: all 0.2s ease; }
input, select, textarea {
  font-family: inherit;
  color: var(--ink-cream);
  background: var(--surface-studio);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 14px;
  width: 100%;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--gold-ptv);
  box-shadow: 0 0 0 2px var(--gold-glow);
}
textarea { resize: vertical; min-height: 90px; }

/* Sticky Studio Topbar */
.studio-topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6, 10, 8, 0.94);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 12px 4%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand-lockup {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo {
  width: 42px;
  height: 42px;
  object-fit: contain;
  filter: drop-shadow(0 2px 8px rgba(229, 179, 56, 0.3));
}
.brand-text h1 {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1.4px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}
.badge-studio {
  background: var(--gold-glow);
  border: 1px solid var(--gold-ptv);
  color: var(--gold-ptv);
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}
.brand-sub {
  font-size: 11px;
  color: var(--ink-subtle);
  letter-spacing: 0.3px;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Base Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 700;
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
}
.btn-gold {
  background: var(--gold-ptv);
  color: #060a08;
}
.btn-gold:hover {
  background: var(--gold-hover);
  box-shadow: 0 4px 14px rgba(229, 179, 56, 0.3);
}
.btn-ghost {
  background: rgba(255, 255, 255, 0.05);
  color: var(--ink-cream);
  border: 1px solid var(--border-subtle);
}
.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--ink-subtle);
}
.btn-danger {
  background: var(--danger-bg);
  color: var(--danger-crimson);
  border: 1px solid rgba(239, 83, 80, 0.3);
}
.btn-danger:hover {
  background: rgba(239, 83, 80, 0.22);
}
.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
}
.btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.04);
  color: var(--ink-cream);
  border: 1px solid var(--border-subtle);
}
.btn-icon:hover {
  background: rgba(255, 255, 255, 0.1);
  color: var(--gold-ptv);
}

/* Studio Shell */
.studio-main {
  flex: 1;
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 4% 60px;
}

/* Quick Metrics Row */
.metrics-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.metric-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  overflow: hidden;
}
.metric-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: var(--gold-ptv);
  opacity: 0.6;
}
.metric-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--ink-subtle);
  font-weight: 700;
}
.metric-value {
  font-size: 26px;
  font-weight: 800;
  color: #fff;
  line-height: 1.1;
}
.metric-desc {
  font-size: 11px;
  color: var(--ink-dim);
}
.metric-card.alert .metric-value {
  color: var(--danger-crimson);
}

/* Primary Tab Navigation */
.studio-tabs-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 14px;
  margin-bottom: 24px;
  overflow-x: auto;
  scrollbar-width: none;
}
.studio-tabs-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  background: transparent;
  color: var(--ink-subtle);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  border: 1px solid transparent;
}
.tab-btn:hover {
  color: var(--ink-cream);
  background: rgba(255, 255, 255, 0.04);
}
.tab-btn.active {
  background: var(--gold-ptv);
  color: #060a08;
  border-color: var(--gold-ptv);
}
.tab-count {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.2);
  color: inherit;
}
.tab-btn.active .tab-count {
  background: rgba(0, 0, 0, 0.25);
  color: #060a08;
}

.tab-pane {
  display: none;
}
.tab-pane.active {
  display: block;
}

/* Common Panel Container */
.panel {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 24px;
}
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 14px;
}
.panel-title {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.panel-sub {
  font-size: 12px;
  color: var(--ink-subtle);
  margin-top: 2px;
}

/* Search and Filters Bar */
.search-bar-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.search-input-wrap {
  flex: 1;
  min-width: 240px;
  position: relative;
}
.search-input-wrap input {
  padding-left: 36px;
}
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-dim);
  pointer-events: none;
}

/* ============================================================
   NETFLIX SERIES ACCORDION CARD STYLES
   ============================================================ */
.series-accordion-card {
  background: var(--surface-studio);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  margin-bottom: 16px;
  overflow: hidden;
  transition: border-color 0.2s ease;
}
.series-accordion-card:hover {
  border-color: rgba(229, 179, 56, 0.3);
}
.series-card-header {
  display: grid;
  grid-template-columns: 88px 1fr auto;
  gap: 18px;
  padding: 18px;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.series-poster-box {
  width: 88px;
  aspect-ratio: 2/3;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: #08110b;
  position: relative;
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.series-poster-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.series-header-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.series-title-row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}
.series-title-text {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.2px;
}
.series-urdu-text {
  font-family: var(--font-urdu);
  font-size: 15px;
  color: var(--gold-ptv);
  direction: rtl;
}
.series-badges-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.pill {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--ink-subtle);
  border: 1px solid var(--border-subtle);
}
.pill-gold {
  background: var(--gold-glow);
  color: var(--gold-ptv);
  border-color: rgba(229, 179, 56, 0.35);
}
.pill-episodes {
  background: var(--phosphor-bg);
  color: var(--phosphor-mint);
  border-color: rgba(46, 139, 87, 0.35);
  font-weight: 800;
}
.series-meta-credits {
  font-size: 12px;
  color: var(--ink-dim);
  line-height: 1.4;
}
.series-meta-credits b {
  color: var(--ink-subtle);
  font-weight: 600;
}
.series-card-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Expanded Episodes Tray */
.series-episodes-tray {
  display: none;
  border-top: 1px solid var(--border-subtle);
  background: rgba(0, 0, 0, 0.25);
  padding: 20px;
}
.series-accordion-card.open .series-episodes-tray {
  display: block;
}
.episodes-tray-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.episodes-tray-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--gold-ptv);
}
.episodes-table {
  width: 100%;
  border-collapse: collapse;
}
.episodes-table th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  color: var(--ink-dim);
  letter-spacing: 0.5px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.episodes-table td {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  font-size: 13px;
  vertical-align: middle;
}
.episodes-table tr:hover td {
  background: rgba(255, 255, 255, 0.02);
}
.ep-num-badge {
  display: inline-block;
  width: 28px;
  height: 28px;
  line-height: 28px;
  text-align: center;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 50%;
  font-weight: 800;
  font-size: 12px;
  color: var(--gold-ptv);
}
.ep-thumb-preview {
  width: 72px;
  aspect-ratio: 16/9;
  border-radius: 4px;
  object-fit: cover;
  background: #000;
  vertical-align: middle;
}

/* ============================================================
   INGESTION STUDIO STYLES (YOUTUBE SEARCH + AI + PLAYLIST)
   ============================================================ */
.ingest-subtabs-nav {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 12px;
}
.ingest-tab-btn {
  background: transparent;
  color: var(--ink-subtle);
  border: 1px solid var(--border-subtle);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 700;
}
.ingest-tab-btn.active {
  background: var(--surface-card);
  color: var(--gold-ptv);
  border-color: var(--gold-ptv);
}
.yt-search-results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  margin-top: 16px;
}
.yt-search-card {
  background: var(--surface-studio);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.yt-search-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  background: #000;
}
.yt-search-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 8px;
}
.yt-search-title {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  line-height: 1.3;
}
.yt-search-meta {
  font-size: 11px;
  color: var(--ink-dim);
}
.yt-search-actions {
  margin-top: auto;
  padding-top: 10px;
  display: flex;
  gap: 8px;
}

/* Form Styles */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.form-grid .full {
  grid-column: 1 / -1;
}
.form-group label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 700;
  color: var(--ink-subtle);
  margin-bottom: 6px;
}
.urdu-input {
  font-family: var(--font-urdu);
  font-size: 16px;
  direction: rtl;
}

/* Status Notifications */
.status-banner {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  display: none;
  margin-top: 12px;
}
.status-banner.show { display: block; }
.status-banner.info { background: rgba(229, 179, 56, 0.1); color: var(--gold-ptv); border: 1px solid rgba(229, 179, 56, 0.3); }
.status-banner.ok { background: var(--phosphor-bg); color: var(--phosphor-mint); border: 1px solid rgba(46, 139, 87, 0.4); }
.status-banner.err { background: var(--danger-bg); color: var(--danger-crimson); border: 1px solid rgba(239, 83, 80, 0.4); }

/* Staged Thumbnail Preview Card */
.thumb-staging-card {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--surface-studio);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-top: 10px;
}
.thumb-staging-preview {
  width: 100px;
  aspect-ratio: 16/9;
  border-radius: 4px;
  object-fit: cover;
  background: #000;
}

/* Modal Overlay */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal-dialog {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  max-width: 680px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
  padding: 26px;
  position: relative;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.modal-title {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
}
.modal-close {
  background: transparent;
  color: var(--ink-subtle);
  font-size: 20px;
  cursor: pointer;
}
.modal-close:hover { color: #fff; }

/* Responsive adjustments */
@media (max-width: 850px) {
  .series-card-header {
    grid-template-columns: 70px 1fr;
    gap: 12px;
  }
  .series-card-actions {
    grid-column: 1 / -1;
    margin-top: 8px;
  }
  .form-grid {
    grid-template-columns: 1fr;
  }
  .studio-topbar {
    padding: 10px 16px;
  }
  .studio-main {
    padding: 16px 16px 50px;
  }
}
</style>
</head>
<body>

  <!-- Studio Topbar -->
  <header class="studio-topbar">
    <div class="brand-lockup">
      <a href="/index.html" title="Go to Public Archive">
        <img class="brand-logo" src="/logo.png" alt="Pak Spotlight">
      </a>
      <div class="brand-text">
        <h1>PAK SPOTLIGHT <span class="badge-studio">STUDIO</span></h1>
        <span class="brand-sub">Classic PTV Archive Management Console</span>
      </div>
    </div>
    <div class="topbar-actions" id="topbarAuthActions">
      <a class="btn btn-ghost btn-sm" href="/index.html">← Public Site</a>
    </div>
  </header>

  <!-- Main Studio Shell -->
  <main class="studio-main" id="studioApp">
    <div style="padding: 100px 20px; text-align: center; color: var(--ink-subtle);">
      <div style="font-size: 36px; margin-bottom: 12px;">📼</div>
      <p>Authenticating studio console…</p>
    </div>
  </main>

  <!-- Modals Container -->
  <div class="modal-backdrop" id="studioModalBackdrop">
    <div class="modal-dialog" id="studioModalDialog"></div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://whcseoasnaswlhnzduix.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fkK2ryuBKr0WK96m34Cczg_7ofQBaOk";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function cleanDramaTitle(title) {
      return String(title || "")
        .replace(/\s*\|\s*.*$/, "")
        .replace(/\s*-\s*(PTV|Pak Spotlight|Classic|Full|Drama|Play|HD).*$/i, "")
        .replace(/\s*\b(Ep|Episode|Part|Qist|His+a?)\s*\.?\s*#?\s*\d+\b.*$/i, "")
        .replace(/\s*[(\[]\s*\d{1,3}\s*[)\]]\s*$/, "")
        .replace(/\s*[-–—:]+\s*$/, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function parseEpisodeNumber(title, description) {
      const text = `${title || ""} ${description || ""}`;
      const m = text.match(/\b(?:ep|episode|part|qist|his+a?)\s*\.?\s*#?\s*(\d{1,3})\b/i)
        || String(title || "").match(/[(\[]\s*(\d{1,2})\s*[)\]]\s*$/)
        || String(title || "").match(/\s(\d{1,2})\s*$/);
      if (!m) return null;
      const n = Number(m[1]);
      return n > 0 && n < 500 ? n : null;
    }

    // Global State
    let authSession = null;
    let allDramas = [];
    let configuredCategories = ["Serial / Series", "Long Play", "Comedy", "Shorts"];
    let configuredFeaturedIds = [];
    let activeStudioTab = "series";
    let seriesSearchTerm = "";
    let playsSearchTerm = "";

    // ----------------------------------------------------
    // DATA LOADING
    // ----------------------------------------------------
    async function fetchArchiveData() {
      const [dramaRes, catRes, featRes] = await Promise.all([
        supabase.from("Drama").select("*").order("id", { ascending: false }),
        fetch("/api/categories").catch(() => null),
        fetch("/api/featured").catch(() => null)
      ]);

      if (dramaRes.data) {
        allDramas = dramaRes.data.map(r => {
          const parsedEp = r.episode_number != null ? Number(r.episode_number) : parseEpisodeNumber(r.title);
          const rawSeries = (r.series_name || "").trim();
          const cleanedTitle = cleanDramaTitle(r.title);
          const isSerialType = ["serial / series", "series", "serial"].includes(String(r.type || "").toLowerCase().trim());
          const inferredSeries = rawSeries || (parsedEp || isSerialType ? cleanedTitle : "");

          return {
            id: r.id,
            title: r.title || "Untitled",
            urdu: r.urdu_title || "",
            year: r.year || "",
            type: r.type || "Serial / Series",
            series_name: inferredSeries,
            episode_number: parsedEp,
            writer: r.writer || "",
            director: r.director || "",
            produced: r.produced || "",
            cast: r.cast || "",
            description: r.description || "",
            youtube_url: r.youtube_url || "",
            thumbnail_url: r.thumbnail_url || ""
          };
        });
      }

      if (catRes && catRes.ok) {
        const catData = await catRes.json();
        if (Array.isArray(catData.categories)) configuredCategories = catData.categories;
      }
      if (featRes && featRes.ok) {
        const featData = await featRes.json();
        if (Array.isArray(featData.featuredIds)) configuredFeaturedIds = featData.featuredIds;
      }
    }

    async function checkAuth() {

        updateTopAuthUi();

    function getSeriesGroups() {
      const seriesMap = new Map();
      allDramas.forEach(d => {
        const isSer = !!d.series_name || ["serial / series", "series", "serial"].includes(String(d.type || "").toLowerCase().trim());
        if (isSer && d.series_name) {
          const k = d.series_name.toLowerCase().trim();
          if (!seriesMap.has(k)) seriesMap.set(k, { name: d.series_name, episodes: [] });
          seriesMap.get(k).episodes.push(d);
        }
      });
      return Array.from(seriesMap.values()).map(s => {
        s.episodes.sort((a, b) => (a.episode_number ?? 9999) - (b.episode_number ?? 9999));
        s.rep = s.episodes.find(e => e.thumbnail_url) || s.episodes[0];
        return s;
      });
    }

    function getStandalonePlays() {
      return allDramas.filter(d => {
        const isSer = !!d.series_name || ["serial / series", "series", "serial"].includes(String(d.type || "").toLowerCase().trim());
        return !isSer || !d.series_name;
      });
    }

            "authorization": "Bearer " + authSession.access_token
          },

        });

        $("f_title").value = f.title || "";

    async function runAutoLinkSeriesTool() {
      const btn = $("autoLinkSeriesBtn");
      const status = $("autoLinkStatus");
      btn.disabled = true;
      status.className = "status-banner show info";
      status.textContent = "Scanning database for series episodes…";

      try {
        let updatedCount = 0;
        for (const d of allDramas) {
          const ep = parseEpisodeNumber(d.title);
          const cleaned = cleanDramaTitle(d.title);
          const needsSeries = !d.series_name && (ep || ["serial / series", "series", "serial"].includes(String(d.type).toLowerCase().trim()));
          const needsEp = d.episode_number == null && ep != null;

          if (needsSeries || needsEp) {
            const updates = {};
            if (needsSeries) updates.series_name = cleaned;
            if (needsEp) updates.episode_number = ep;

            const { error } = await supabase.from("Drama").update(updates).eq("id", d.id);
            if (!error) updatedCount++;
          }
        }

        status.className = "status-banner show ok";
        status.textContent = `Auto-linked ${updatedCount} drama episodes into series! Reloading…`;
        await fetchArchiveData();
        renderStudioDashboard();
      } catch (err) {
        status.className = "status-banner show err";
        status.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function runBatchThumbnailSync() {
      const btn = $("batchSyncThumbsBtn");
      const status = $("batchSyncStatus");
      btn.disabled = true;
      status.className = "status-banner show info";
      status.textContent = "Checking for missing photos…";

      const targets = allDramas.filter(d => (!d.thumbnail_url || !d.thumbnail_url.trim()) && d.youtube_url);
      if (targets.length === 0) {
        status.className = "status-banner show ok";
        status.textContent = "All dramas already have artwork!";
        btn.disabled = false;
        return;
      }

      status.textContent = `Syncing ${targets.length} missing photos to Supabase Storage…`;
      let success = 0;

      for (const d of targets) {
        try {
          const ytMatch = d.youtube_url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=))([\w-]{11})/);
          const ytId = ytMatch ? ytMatch[1] : null;
          if (!ytId) continue;
          const imgUrl = `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg`;

          const storeRes = await fetch("/api/store-thumbnail", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "authorization": "Bearer " + authSession.access_token
            },
            body: JSON.stringify({ dramaId: d.id, imageUrl: imgUrl })
          });
          if (storeRes.ok) success++;
        } catch {}
      }

      status.className = "status-banner show ok";
      status.textContent = `Successfully synced ${success} photos! Reloading…`;
      await fetchArchiveData();
      renderStudioDashboard();
      btn.disabled = false;
    }

          cast: $("m_cast").value.trim(),
          youtube_url: ytUrl
        };

        const { data, error } = await supabase.from("Drama").insert(payload).select().single();
        if (error) {
          stat.className = "status-banner show err";
          stat.textContent = error.message;
          btn.disabled = false;
        } else {
          // Auto sync thumbnail in background
          if (data?.id && ytUrl) {
            fetch(`/api/store-thumbnail`, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "authorization": "Bearer " + authSession.access_token
              },
              body: JSON.stringify({ dramaId: data.id, imageUrl: `https://i.ytimg.com/vi/${extractYouTubeId(ytUrl)}/hqdefault.jpg` })
            }).catch(() => {});
          }
          closeModal();
          await fetchArchiveData();
          renderStudioDashboard();
        }
      };
    }

    function extractYouTubeId(url) {
      if (!url) return "";
      const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=))([\w-]{11})/);
      return m ? m[1] : "";
    }

    async function autoDetectModalEpisode(seriesName) {
      const url = $("modalEpYtUrl").value.trim();
      const status = $("modalEpDetectStatus");
      if (!url) return;
      status.className = "status-banner show info";
      status.textContent = "Detecting episode number…";
      try {
        const res = await fetch("/api/identify", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "authorization": "Bearer " + authSession.access_token
          },
          body: JSON.stringify({ url })
        });
        const v = await res.json();
        const ep = parseEpisodeNumber(v.title, v.description);
        if (ep) {
          $("m_epNum").value = ep;
          $("m_title").value = `${seriesName} - Episode ${ep}`;
        }
        status.className = "status-banner show ok";
        status.textContent = `Found: ${v.title}`;
      } catch (err) {
        status.className = "status-banner show err";
        status.textContent = err.message;
      }
    }

    function openBulkEditModal(seriesName) {
      const series = getSeriesGroups().find(s => s.name.toLowerCase() === seriesName.toLowerCase());
      if (!series) return;
      const rep = series.rep || {};

      openModal(`
        <div class="modal-header">
          <h3 class="modal-title">✎ Bulk Edit: ${esc(seriesName)}</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:12px;color:var(--ink-subtle);margin-bottom:16px">
          Updates writer, director, cast, year, or category across all <b>${series.episodes.length} episodes</b> at once.
        </p>
        <form id="bulkEditForm">
          <div class="form-grid">
            <div>
              <label>Series Name *</label>
              <input id="b_series" value="${esc(seriesName)}" required>
            </div>
            <div>
              <label>Urdu Name</label>
              <input id="b_urdu" class="urdu-input" value="${esc(rep.urdu || '')}">
            </div>
            <div>
              <label>Year</label>
              <input id="b_year" value="${esc(rep.year || '')}">
            </div>
            <div>
              <label>Category</label>
              <select id="b_type">
                ${configuredCategories.map(c => `<option value="${esc(c)}" ${rep.type === c ? 'selected' : ''}>${esc(c)}</option>`).join("")}
              </select>
            </div>
            <div>
              <label>Writer</label>
              <input id="b_writer" value="${esc(rep.writer || '')}">
            </div>
            <div>
              <label>Director</label>
              <input id="b_director" value="${esc(rep.director || '')}">
            </div>
            <div class="full">
              <label>Star Cast</label>
              <input id="b_cast" value="${esc(rep.cast || '')}">
            </div>
          </div>

          <div style="margin-top:20px;display:flex;justify-content:flex-end;gap:10px">
            <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-gold" id="bSubmitBtn">Apply to All ${series.episodes.length} Episodes</button>
          </div>
          <div class="status-banner" id="bStatus"></div>
        </form>
      `);

      $("bulkEditForm").onsubmit = async e => {
        e.preventDefault();
        const stat = $("bStatus");
        const btn = $("bSubmitBtn");
        btn.disabled = true;
        stat.className = "status-banner show info";
        stat.textContent = `Applying updates across ${series.episodes.length} episodes…`;

        const newSeries = $("b_series").value.trim();
        const payload = {
          series_name: newSeries,
          urdu_title: $("b_urdu").value.trim(),
          year: $("b_year").value.trim(),
          type: $("b_type").value,
          writer: $("b_writer").value.trim(),
          director: $("b_director").value.trim(),
          cast: $("b_cast").value.trim()
        };

        const epIds = series.episodes.map(ep => ep.id);
        const { error } = await supabase.from("Drama").update(payload).in("id", epIds);

        if (error) {
          stat.className = "status-banner show err";
          stat.textContent = error.message;
          btn.disabled = false;
        } else {
          closeModal();
          await fetchArchiveData();
          renderStudioDashboard();
        }
      };
    }

    function openEditEpisodeModal(id) {
      const d = allDramas.find(x => x.id === id);
      if (!d) return;

      openModal(`
        <div class="modal-header">
          <h3 class="modal-title">Edit Record: ${esc(d.title)}</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <form id="editRecordForm">
          <div class="form-grid">
            <div class="full">
              <label>Title *</label>
              <input id="e_title" value="${esc(d.title)}" required>
            </div>
            <div>
              <label>Series Name</label>
              <input id="e_series" value="${esc(d.series_name || '')}">
            </div>
            <div>
              <label>Episode Number</label>
              <input id="e_episode" type="number" value="${d.episode_number ?? ''}">
            </div>
            <div>
              <label>Urdu Title</label>
              <input id="e_urdu" class="urdu-input" value="${esc(d.urdu)}">
            </div>
            <div>
              <label>Year</label>
              <input id="e_year" value="${esc(d.year)}">
            </div>
            <div>
              <label>Category</label>
              <select id="e_type">
                ${configuredCategories.map(c => `<option value="${esc(c)}" ${d.type === c ? 'selected' : ''}>${esc(c)}</option>`).join("")}
              </select>
            </div>
            <div>
              <label>Writer</label>
              <input id="e_writer" value="${esc(d.writer)}">
            </div>
            <div>
              <label>Director</label>
              <input id="e_director" value="${esc(d.director)}">
            </div>
            <div class="full">
              <label>Star Cast</label>
              <input id="e_cast" value="${esc(d.cast)}">
            </div>
            <div class="full">
              <label>YouTube Link</label>
              <input id="e_youtube" type="url" value="${esc(d.youtube_url)}">
            </div>
            <div class="full">
              <label>Thumbnail Public URL</label>
              <input id="e_thumb" type="url" value="${esc(d.thumbnail_url)}">
            </div>
          </div>

          <div style="margin-top:20px;display:flex;justify-content:flex-end;gap:10px">
            <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-gold" id="eSubmitBtn">Save Changes</button>
          </div>
          <div class="status-banner" id="eStatus"></div>
        </form>
      `);

      $("editRecordForm").onsubmit = async e => {
        e.preventDefault();
        const stat = $("eStatus");
        const btn = $("eSubmitBtn");
        btn.disabled = true;
        stat.className = "status-banner show info";
        stat.textContent = "Saving changes…";

        const payload = {
          title: $("e_title").value.trim(),
          series_name: $("e_series").value.trim() || null,
          episode_number: $("e_episode").value ? Number($("e_episode").value) : null,
          urdu_title: $("e_urdu").value.trim(),
          year: $("e_year").value.trim(),
          type: $("e_type").value,
          writer: $("e_writer").value.trim(),
          director: $("e_director").value.trim(),
          cast: $("e_cast").value.trim(),
          youtube_url: $("e_youtube").value.trim(),
          thumbnail_url: $("e_thumb").value.trim()
        };

        const { error } = await supabase.from("Drama").update(payload).eq("id", id);
        if (error) {
          stat.className = "status-banner show err";
          stat.textContent = error.message;
          btn.disabled = false;
        } else {
          closeModal();
          await fetchArchiveData();
          renderStudioDashboard();
        }
      };
    }

    async function deleteDramaRecord(id, title) {
      if (!confirm(`Are you sure you want to delete "${title}" from the archive?`)) return;
      const { error } = await supabase.from("Drama").delete().eq("id", id);
      if (error) {
        alert("Delete failed: " + error.message);
      } else {
        await fetchArchiveData();
        renderStudioDashboard();
      }
    }

    // ============================================================
    // SINGLE DRAMA FORM SUBMIT
    // ============================================================
    function bindStudioEvents() {
      // Series search listener
      const sInput = $("seriesSearchInput");
      if (sInput) {
        sInput.addEventListener("input", e => {
          seriesSearchTerm = e.target.value.trim();
          renderStudioDashboard();
          const next = $("seriesSearchInput");
          if (next) { next.focus(); next.selectionStart = next.selectionEnd = next.value.length; }
        });
      }

      // Plays search listener
      const pInput = $("playsSearchInput");
      if (pInput) {
        pInput.addEventListener("input", e => {
          playsSearchTerm = e.target.value.trim();
          renderStudioDashboard();
          const next = $("playsSearchInput");
          if (next) { next.focus(); next.selectionStart = next.selectionEnd = next.value.length; }
        });
      }

      // Single Ingest form submit
      const f = $("singleIngestForm");
      if (f) {
        f.onsubmit = async e => {
          e.preventDefault();
          const btn = $("saveDramaSubmitBtn");
          const status = $("saveDramaStatus");
          btn.disabled = true;
          status.className = "status-banner show info";
          status.textContent = "Saving drama record…";

          const payload = {
            title: $("f_title").value.trim(),
            urdu_title: $("f_urdu").value.trim(),
            series_name: $("f_series").value.trim() || null,
            episode_number: $("f_episode").value ? Number($("f_episode").value) : null,
            year: $("f_year").value.trim(),
            type: $("f_type").value,
            writer: $("f_writer").value.trim(),
            director: $("f_director").value.trim(),
            produced: $("f_produced").value.trim(),
            cast: $("f_cast").value.trim(),
            description: $("f_description").value.trim(),
            youtube_url: $("f_youtube").value.trim()
          };

          const { data, error } = await supabase.from("Drama").insert(payload).select().single();
          if (error) {
            status.className = "status-banner show err";
            status.textContent = error.message;
            btn.disabled = false;
            return;
          }

          const dramaId = data.id;
          const customFile = $("f_customFile")?.files?.[0];

          if (customFile) {
            status.textContent = "Uploading custom photo…";
            const ext = (customFile.type || "image/jpeg").split("/")[1]?.replace("jpeg", "jpg") || "jpg";
            const storagePath = `drama/${dramaId}.${ext}`;
            const { error: upErr } = await supabase.storage.from("thumbnails").upload(storagePath, customFile, {
              contentType: customFile.type || "image/jpeg",
              upsert: true
            });
            if (!upErr) {
              const pubUrl = supabase.storage.from("thumbnails").getPublicUrl(storagePath).data.publicUrl;
              await supabase.from("Drama").update({ thumbnail_url: pubUrl }).eq("id", dramaId);
            }
          } else if (stagedThumbnailUrl) {
            status.textContent = "Storing YouTube thumbnail…";
            await fetch(`/api/store-thumbnail`, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "authorization": "Bearer " + authSession.access_token
              },
              body: JSON.stringify({ dramaId, imageUrl: stagedThumbnailUrl })
            }).catch(() => {});
          }

          status.className = "status-banner show ok";
          status.textContent = "Drama successfully saved to archive!";
          setTimeout(async () => {
            await fetchArchiveData();
            switchStudioTab("series");
            renderStudioDashboard();
          }, 1200);
        };
      }
    }

    // ============================================================
    // PLAYLIST BATCH IMPORT LOGIC
    // ============================================================
    let plItems = [];
    async function runPlaylistPreview() {
      const url = $("plInputUrl").value.trim();
      const status = $("plStatusMsgTop");
      const btn = $("plPreviewBtn");
      if (!url) return;

      btn.disabled = true;
      status.className = "status-banner show info";
      status.textContent = "Fetching playlist items from YouTube…";

      try {
        const res = await fetch("/api/playlist-preview", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "authorization": "Bearer " + authSession.access_token
          },
          body: JSON.stringify({ url, limit: 50 })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "Preview failed");

        plItems = (data.items || []).map((it, i) => ({
          ...it,
          ep: it.episode || String(i + 1),
          selected: true
        }));

        $("plEpisodesHeaderTitle").textContent = `${plItems.length} Episodes Detected in Playlist`;
        $("plSeriesName").value = data.suggestedSeries || cleanDramaTitle(data.playlist?.title);
        $("plItemsListBox").innerHTML = plItems.map((it, i) => `
          <div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
            <input type="checkbox" id="plCheck-${i}" ${it.selected ? 'checked' : ''} onchange="plItems[${i}].selected=this.checked">
            <span class="ep-num-badge">${it.ep}</span>
            <img src="${esc(it.thumbnail)}" style="width:60px;aspect-ratio:16/9;object-fit:cover;border-radius:4px">
            <span style="font-size:13px;font-weight:600;color:#fff">${esc(it.title)}</span>
          </div>
        `).join("");

        $("plWizardContent").style.display = "block";
        status.className = "status-banner show ok";
        status.textContent = `Preview loaded with ${plItems.length} videos. Review and click "Add to Archive".`;
      } catch (err) {
        status.className = "status-banner show err";
        status.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function toggleAllPlaylistChecks(checked) {
      plItems.forEach((it, i) => {
        it.selected = checked;
        const cb = $(`plCheck-${i}`);
        if (cb) cb.checked = checked;
      });
    }

    async function runPlaylistBatchImport() {
      const url = $("plInputUrl").value.trim();
      const seriesName = $("plSeriesName").value.trim();
      const status = $("plBatchStatus");
      const btn = $("plStartImportBtn");
      const selectedIds = plItems.filter(x => x.selected).map(x => x.id);

      if (!selectedIds.length) {
        alert("Please select at least one episode to import.");
        return;
      }

      btn.disabled = true;
      status.className = "status-banner show info";
      status.textContent = `Importing ${selectedIds.length} episodes…`;

      try {
        const res = await fetch("/api/playlist-import", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "authorization": "Bearer " + authSession.access_token
          },
          body: JSON.stringify({
            url,
            seriesName,
            category: $("plCategory").value,
            videoIds: selectedIds
          })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "Batch import failed");

        status.className = "status-banner show ok";
        status.textContent = `Successfully added ${data.added} episodes to "${data.series}"! (${data.skipped} already in archive). Reloading…`;
        setTimeout(async () => {
          await fetchArchiveData();
          switchStudioTab("series");
          renderStudioDashboard();
        }, 1500);
      } catch (err) {
        status.className = "status-banner show err";
        status.textContent = err.message;
        btn.disabled = false;
      }
    }

    // Initialize Studio on load
    checkAuth();
  </script>
</body>
</html>
