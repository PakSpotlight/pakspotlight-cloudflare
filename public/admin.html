<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pak Spotlight — Admin Studio Console</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Noto+Nastaliq+Urdu:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/admin-components.css">
</head>
<body>

  <!-- Studio Topbar -->
  <header class="studio-topbar">
    <div class="brand-lockup">
      <a href="/index.html" title="Go to Public Archive">
        <img class="brand-logo" src="/logo.png" alt="Pak Spotlight">
      </a>
      <div class="brand-text">
        <h1>PAK SPOTLIGHT <span class="badge-studio">STUDIO</span></h1>
        <span class="brand-sub">Classic PTV Archive Management Console</span>
      </div>
    </div>
    <div class="topbar-actions" id="topbarAuthActions">
      <a class="btn btn-ghost btn-sm" href="/index.html">← Public Site</a>
    </div>
  </header>

  <!-- Main Studio Shell -->
  <main class="studio-main" id="studioApp">
    <div style="padding: 100px 20px; text-align: center; color: var(--ink-subtle);">
      <div style="font-size: 36px; margin-bottom: 12px;">📼</div>
      <p>Authenticating studio console…</p>
    </div>
  </main>

  <!-- Modals Container -->
  <div class="modal-backdrop" id="studioModalBackdrop">
    <div class="modal-dialog" id="studioModalDialog"></div>
  </div>

  <!-- Supabase CDN (defines window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Modular Studio Scripts -->
  <script src="/js/admin/state.js"></script>
  <script src="/js/admin/series.js"></script>
  <script src="/js/admin/plays.js"></script>
  <script src="/js/admin/ingest.js"></script>
  <script src="/js/admin/tools.js"></script>
  <script src="/js/admin/modals.js"></script>

  <script>
    // Bootstrap Admin Studio
    document.addEventListener("DOMContentLoaded", () => {
      checkAuth();
    });
  </script>
</body>
</html>
